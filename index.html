<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Box</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#130E20;
  --bg-2:#181129;
  --panel:#1D1633;
  --panel-2:#251C3E;
  --border:rgba(241,238,248,0.09);
  --border-strong:rgba(241,238,248,0.17);
  --text:#F1EEF8;
  --muted:#A79FC0;
  --muted-2:#6E6690;
  --amber:#D98C4A;
  --amber-dim:#A8672F;
  --water:#4FC6EF;
  --gold:#D8AE52;
  --rose:#FF4D6D;
  --profit:#3ED598;
  --loss:#FF5D6C;
  --radius-sm:8px;
  --radius:14px;
  --radius-lg:22px;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 600px at 50% -10%, #251C3E 0%, transparent 60%),
    radial-gradient(900px 500px at 90% 10%, rgba(217,140,74,0.07) 0%, transparent 60%),
    radial-gradient(700px 500px at 6% 30%, rgba(79,198,239,0.05) 0%, transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:'IBM Plex Mono', monospace;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Space Grotesk', sans-serif;}
#app{min-height:100vh; display:flex; flex-direction:column;}
::selection{background:var(--amber); color:#0A0F1C;}
a{color:inherit;}
button{font-family:inherit; cursor:pointer;}
input, select{font-family:inherit;}
:focus-visible{outline:2px solid var(--amber); outline-offset:2px;}

/* ---------- shared layout ---------- */
.view{width:100%; max-width:980px; margin:0 auto; padding:28px 20px 64px; flex:1; animation:viewIn .5s ease both;}
@keyframes viewIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 24px; border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:20;
  background:rgba(10,15,28,0.85); backdrop-filter:blur(10px);
}
.brand{display:flex; align-items:center; gap:10px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; letter-spacing:0.2px;}
.brand .bx{
  width:26px;height:26px;border-radius:50% 50% 50% 4px;
  background:linear-gradient(135deg,var(--rose),var(--amber));
  display:flex;align-items:center;justify-content:center;
  color:#fff; font-size:13px; font-weight:700; transform:rotate(45deg);
  box-shadow:0 4px 12px -3px rgba(255,77,109,0.5);
}
.brand .bx span{transform:rotate(-45deg); display:block;}
.brand small{display:block; font-size:10px; color:var(--muted-2); font-weight:500; letter-spacing:0.3px; margin-top:1px;}
.bubbles{position:absolute; inset:0; overflow:hidden; pointer-events:none;}
.bubble{position:absolute; bottom:-40px; border-radius:50%; background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.5), rgba(79,198,239,0.12) 60%, transparent 75%); animation:rise linear infinite;}
@keyframes rise{0%{transform:translateY(0) translateX(0); opacity:0;}10%{opacity:0.8;}90%{opacity:0.5;}100%{transform:translateY(-560px) translateX(var(--drift,12px)); opacity:0;}}
.session{display:flex; align-items:center; gap:14px; font-size:13px; color:var(--muted);}
.tag{
  padding:4px 10px; border-radius:999px; font-size:11px; font-weight:600;
  border:1px solid var(--border-strong); letter-spacing:0.3px;
}
.tag.admin{color:var(--amber); border-color:rgba(245,166,35,0.35); background:rgba(245,166,35,0.08);}
.tag.viewer{color:var(--muted); }
.logout{
  background:transparent; border:1px solid var(--border-strong); color:var(--muted);
  padding:6px 12px; border-radius:8px; font-size:12px; transition:all .18s ease;
}
.logout:hover{color:var(--text); border-color:var(--muted);}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:13px 22px; border-radius:11px; border:1px solid var(--border-strong);
  background:var(--panel-2); color:var(--text); font-size:14px; font-weight:600;
  transition:transform .15s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease;
}
.btn:hover{transform:translateY(-2px); border-color:var(--amber); box-shadow:0 8px 24px -12px rgba(245,166,35,0.35);}
.btn:active{transform:translateY(0);}
.btn.primary{background:linear-gradient(135deg,var(--amber),#e0901a); color:#241703; border-color:transparent;}
.btn.primary:hover{box-shadow:0 10px 28px -10px rgba(245,166,35,0.55);}
.btn.ghost{background:transparent;}
.btn.danger{color:var(--loss); border-color:rgba(255,93,108,0.35); background:rgba(255,93,108,0.06);}
.btn.danger:hover{border-color:var(--loss); box-shadow:0 8px 22px -12px rgba(255,93,108,0.4);}
.btn.small{padding:8px 14px; font-size:12.5px; border-radius:8px;}
.btn:disabled{opacity:0.4; cursor:not-allowed; transform:none; box-shadow:none;}

.panel{
  background:linear-gradient(180deg, var(--panel), var(--panel-2));
  border:1px solid var(--border); border-radius:var(--radius-lg);
  padding:26px;
}
.field-label{font-size:11px; text-transform:uppercase; letter-spacing:1.2px; color:var(--muted-2); margin-bottom:7px; display:block; font-family:'Space Grotesk',sans-serif; font-weight:600;}
.input{
  width:100%; padding:11px 13px; border-radius:9px; border:1px solid var(--border-strong);
  background:var(--bg-2); color:var(--text); font-size:13.5px; transition:border-color .15s ease, background .15s ease;
}
.input:focus{border-color:var(--amber); background:#0F1728;}
.input::placeholder{color:var(--muted-2);}

/* ---------- LOGIN ---------- */
.login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; position:relative; overflow:hidden;}
.gate-glow{position:absolute; width:560px; height:560px; border-radius:50%; background:radial-gradient(circle, rgba(217,140,74,0.13), rgba(79,198,239,0.06) 45%, transparent 68%); top:-150px; left:50%; transform:translateX(-50%); pointer-events:none;}
.login-card{
  width:100%; max-width:400px; position:relative; z-index:2;
  background:linear-gradient(180deg, var(--panel), var(--panel-2));
  border:1px solid var(--border-strong); border-radius:var(--radius-lg);
  padding:34px 30px; box-shadow:0 30px 80px -30px rgba(0,0,0,0.6);
}
.login-logo{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:22px;}
.login-logo .bx-lg{
  width:56px;height:56px;border-radius:50% 50% 50% 6px;
  background:linear-gradient(135deg,var(--rose),var(--amber));
  display:flex;align-items:center;justify-content:center; color:#fff; font-size:26px; font-weight:700;
  box-shadow:0 12px 30px -10px rgba(255,77,109,0.5); transform:rotate(45deg);
}
.login-logo .bx-lg span{transform:rotate(-45deg); display:block;}
.login-logo h1{margin:0; font-size:20px; letter-spacing:0.3px;}
.login-logo p{margin:0; font-size:12px; color:var(--muted); letter-spacing:0.4px;}
.tabs{display:flex; border:1px solid var(--border-strong); border-radius:10px; padding:3px; margin-bottom:20px;}
.tab{flex:1; text-align:center; padding:8px 0; font-size:12.5px; font-weight:600; border-radius:8px; color:var(--muted); transition:all .18s ease; background:transparent; border:none;}
.tab.active{background:var(--amber); color:#241703;}
.form-row{margin-bottom:14px;}
.err-msg{
  background:rgba(255,93,108,0.08); border:1px solid rgba(255,93,108,0.3); color:var(--loss);
  font-size:12.5px; padding:10px 12px; border-radius:9px; margin-bottom:14px; display:none;
}
.err-msg.show{display:block; animation:shake .35s ease;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
.ok-msg{background:rgba(62,213,152,0.08); border:1px solid rgba(62,213,152,0.3); color:var(--profit); font-size:12.5px; padding:10px 12px; border-radius:9px; margin-bottom:14px; display:none;}
.ok-msg.show{display:block;}
.hint{font-size:11px; color:var(--muted-2); margin-top:16px; text-align:center; line-height:1.6;}

.gate-overlay{
  position:fixed; inset:0; background:#0A0F1C; z-index:100;
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:18px;
}
.gate-bar{width:220px; height:14px; border-radius:7px; background:repeating-linear-gradient(45deg, var(--amber) 0 14px, #1a1206 14px 28px); transform-origin:left center; animation:gateLift 1s cubic-bezier(.5,0,.2,1) forwards;}
@keyframes gateLift{0%{transform:rotate(0deg);}100%{transform:rotate(-72deg) translateY(-4px);}}
.gate-txt{font-family:'Space Grotesk',sans-serif; font-size:13px; color:var(--muted); letter-spacing:1px; animation:fadeInSlow .6s ease;}
@keyframes fadeInSlow{from{opacity:0;}to{opacity:1;}}

/* ---------- HOME ---------- */
.hero{text-align:center; padding:52px 12px 18px;}
.heart{
  font-size:34px; display:inline-block; animation:heartbeat 1.8s ease-in-out infinite;
  filter:drop-shadow(0 0 14px rgba(255,77,109,0.65));
}
@keyframes heartbeat{0%,100%{transform:scale(1);}15%{transform:scale(1.22);}30%{transform:scale(1);}45%{transform:scale(1.16);}60%{transform:scale(1);}}
.hero h1{
  font-size:clamp(26px,5vw,42px); margin:14px 0 6px; letter-spacing:0.2px;
  background:linear-gradient(135deg,#fff,#c9d3e6 60%, var(--amber));
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
}
.hero p{color:var(--muted); font-size:14px; margin:0;}
.hero-illustration{
  margin:34px auto 0; max-width:640px; position:relative; border-radius:22px; padding:10px;
  background:linear-gradient(160deg, rgba(217,140,74,0.35), rgba(79,198,239,0.18));
  box-shadow:0 34px 80px -32px rgba(0,0,0,0.75);
}
.hero-illustration svg{display:block; width:100%; height:auto;}
.hero-photo-frame{position:relative; border-radius:16px; overflow:hidden; isolation:isolate;}
.hero-photo-frame img{display:block; width:100%; height:auto; filter:saturate(1.08) contrast(1.03);}
.hero-photo-frame::after{
  content:""; position:absolute; inset:0;
  box-shadow:inset 0 0 60px 18px var(--bg), inset 0 0 0 1px rgba(255,255,255,0.06);
  background:radial-gradient(120% 100% at 50% 50%, transparent 55%, rgba(19,14,32,0.55) 100%);
  pointer-events:none;
}
.hero-photo-frame .fbub{position:absolute; border-radius:50%; background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.85), rgba(255,255,255,0.05) 65%); animation:driftBub 6s ease-in-out infinite; pointer-events:none;}
@keyframes driftBub{0%,100%{transform:translateY(0);}50%{transform:translateY(-14px);}}
.hero-caption{margin-top:16px; text-align:center;}
.hero-caption .biz-name{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; letter-spacing:0.3px; color:var(--text);}
.hero-caption .biz-sub{font-size:11.5px; color:var(--muted-2); margin-top:4px; line-height:1.7;}
.home-actions{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:38px;}
@media (max-width:620px){.home-actions{grid-template-columns:1fr;}}
.big-opt{
  padding:30px 22px; border-radius:18px; border:1px solid var(--border-strong);
  background:linear-gradient(160deg, var(--panel-2), var(--panel));
  text-align:left; position:relative; overflow:hidden; transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease;
}
.big-opt::after{content:""; position:absolute; inset:0; background:radial-gradient(220px 120px at 90% -10%, rgba(245,166,35,0.16), transparent 70%); opacity:0; transition:opacity .25s ease;}
.big-opt:hover{transform:translateY(-4px); border-color:var(--amber); box-shadow:0 20px 50px -24px rgba(245,166,35,0.4);}
.big-opt:hover::after{opacity:1;}
.big-opt .icon{font-size:26px; margin-bottom:14px; display:block;}
.big-opt h3{
  font-size:19px; font-weight:700; letter-spacing:0.4px; text-transform:uppercase; margin:0 0 6px; position:relative;
}
.big-opt p{color:var(--muted); font-size:12.5px; margin:0; position:relative;}

/* ---------- generic section header ---------- */
.section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; gap:12px; flex-wrap:wrap;}
.section-head h2{font-size:23px; margin:0; letter-spacing:0.2px;}
.section-head .sub{color:var(--muted); font-size:12.5px; margin-top:4px;}
.crumb{font-size:11.5px; color:var(--muted-2); letter-spacing:0.5px; margin-bottom:6px;}

/* ---------- option grid (logs / dashboard) ---------- */
.opt-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:16px;}
@media (max-width:620px){.opt-grid{grid-template-columns:1fr;}}
.opt-grid.cols-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:820px){.opt-grid.cols-4{grid-template-columns:repeat(2,1fr);}}
.opt-card{
  padding:24px 20px; border-radius:16px; border:1px solid var(--border-strong);
  background:var(--panel-2); text-align:left; transition:all .18s ease;
}
.opt-card:hover{transform:translateY(-3px); border-color:var(--amber);}
.opt-card .icon{font-size:22px;}
.opt-card h3{margin:10px 0 4px; font-size:15.5px;}
.opt-card p{margin:0; color:var(--muted); font-size:12px;}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--bg-2);}
table{width:100%; border-collapse:collapse; min-width:640px;}
thead th{
  text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:var(--muted-2);
  padding:14px 14px; border-bottom:1px solid var(--border-strong); font-family:'Space Grotesk',sans-serif; font-weight:600;
  background:var(--panel);
}
tbody td{padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr.empty-row{background:rgba(245,166,35,0.02);}
tbody tr:hover{background:rgba(255,255,255,0.015);}
.cell-input{width:100%; min-width:90px; padding:8px 9px; border-radius:7px; border:1px solid transparent; background:transparent; color:var(--text); font-size:12.5px;}
.cell-input:hover{border-color:var(--border-strong);}
.cell-input:focus{border-color:var(--amber); background:var(--panel);}
.cell-input:disabled{color:var(--muted); cursor:default;}
.sno-badge{
  display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:7px;
  background:var(--panel); font-size:11px; color:var(--muted); border:1px solid var(--border-strong);
}
.row-actions{display:flex; gap:6px; align-items:center;}
.icon-btn{
  width:30px; height:30px; border-radius:7px; border:1px solid var(--border-strong); background:transparent;
  color:var(--muted); display:flex; align-items:center; justify-content:center; font-size:13px; transition:all .15s ease;
}
.icon-btn:hover{border-color:var(--rose); color:var(--rose);}
.icon-btn.save:hover{border-color:var(--profit); color:var(--profit);}
.profit-val{font-weight:700;}
.profit-val.pos{color:var(--profit);}
.profit-val.neg{color:var(--loss);}
.empty-note{padding:16px; text-align:center; color:var(--muted-2); font-size:12px;}

.actions-row{display:flex; gap:12px; margin-top:22px; flex-wrap:wrap;}

/* ---------- summary cards ---------- */
.stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:24px;}
@media (max-width:680px){.stat-grid{grid-template-columns:1fr;}}
.stat-card{padding:20px; border-radius:15px; border:1px solid var(--border-strong); background:var(--panel-2);}
.stat-card .label{font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--muted-2); font-family:'Space Grotesk',sans-serif; font-weight:600;}
.stat-card .val{font-size:26px; font-weight:700; margin-top:8px; font-family:'Space Grotesk',sans-serif;}
.stat-card.rev .val{color:var(--amber);}
.stat-card.exp .val{color:var(--muted);}
.stat-card.pl .val.pos{color:var(--profit);}
.stat-card.pl .val.neg{color:var(--loss);}
.pl-banner{
  margin-bottom:22px; padding:16px 20px; border-radius:14px; font-weight:700; font-size:14px;
  display:flex; align-items:center; gap:10px; letter-spacing:0.3px;
}
.pl-banner.pos{background:rgba(62,213,152,0.1); color:var(--profit); border:1px solid rgba(62,213,152,0.3);}
.pl-banner.neg{background:rgba(255,93,108,0.1); color:var(--loss); border:1px solid rgba(255,93,108,0.3);}

.range-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:24px; align-items:end;}
.range-row .form-row{margin:0; min-width:150px;}

/* history list */
.history-list{display:flex; flex-direction:column; gap:8px;}
.history-item{display:flex; align-items:center; justify-content:space-between; padding:13px 16px; border:1px solid var(--border); border-radius:11px; background:var(--panel-2); font-size:12.5px;}
.history-item .who{display:flex; align-items:center; gap:10px;}
.avatar{width:28px; height:28px; border-radius:8px; background:linear-gradient(135deg,var(--amber),#e0901a); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:#241703;}
.history-item .when{color:var(--muted-2);}

/* graph */
.chart-legend{display:flex; gap:18px; margin-bottom:18px; flex-wrap:wrap;}
.legend-item{display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted);}
.legend-dot{width:9px; height:9px; border-radius:3px;}
.chart-svg-wrap{background:var(--bg-2); border:1px solid var(--border); border-radius:var(--radius); padding:20px 10px 8px; overflow-x:auto;}
.bar{transition:opacity .15s ease;}
.bar:hover{opacity:0.75;}
.axis-label{font-size:9.5px; fill:var(--muted-2); font-family:'IBM Plex Mono',monospace;}

.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); z-index:200;
  background:var(--panel-2); border:1px solid var(--border-strong); color:var(--text); padding:11px 18px;
  border-radius:10px; font-size:12.5px; opacity:0; transition:all .3s ease; display:flex; align-items:center; gap:8px;
  box-shadow:0 20px 40px -15px rgba(0,0,0,0.5);
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.toast.ok{border-color:rgba(62,213,152,0.4); color:var(--profit);}
.toast.err{border-color:rgba(255,93,108,0.4); color:var(--loss);}

.viewer-note{
  font-size:11.5px; color:var(--muted-2); background:rgba(255,255,255,0.02); border:1px solid var(--border);
  padding:9px 13px; border-radius:9px; margin-bottom:16px; display:inline-block;
}
.footer-space{height:20px;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>


<script>
(function(){
"use strict";

/* ============ STATE ============ */
var DATA_KEY = "reportbox-app-data";
var state = {
  view: "login",
  stack: [],
  user: null,        // {name, canEdit}
  loading: true,
  data: { vehicles: [], reports: [], users: {}, loginHistory: [] }
};
var loginMode = "login"; // or "register"

/* ============ STORAGE ============ */
/* ============ FREE CLOUD STORAGE (SUPABASE) ============ */
/*
  ONE-TIME SETUP:
  1. Create a free Supabase project.
  2. Run the SQL from supabase_setup.sql in Supabase SQL Editor.
  3. Put your Project URL and anon/public key below.
  The anon key is designed to be used in browser apps.
*/
var SUPABASE_URL = "https://ulpfmqpbzmpmuetjcddj.supabase.co";
var SUPABASE_ANON_KEY = "sb_publishable_gXOv4sR2S223g3gy3kmCtA_1nqZb-3U";
var CLOUD_ROW_ID = 1;

function cloudConfigured(){
  return SUPABASE_URL.indexOf("YOUR_") !== 0 && SUPABASE_ANON_KEY.indexOf("YOUR_") !== 0;
}

function cloudHeaders(extra){
  return Object.assign({
    "apikey": SUPABASE_ANON_KEY,
    "Authorization": "Bearer " + SUPABASE_ANON_KEY,
    "Content-Type": "application/json"
  }, extra || {});
}

async function cloudGet(){
  var url = SUPABASE_URL.replace(/\/$/, "") + "/rest/v1/reportbox_data?id=eq." + CLOUD_ROW_ID + "&select=payload";
  var res = await fetch(url, {headers:cloudHeaders()});
  if(!res.ok) throw new Error("Cloud read failed (" + res.status + ")");
  var rows = await res.json();
  return rows.length ? rows[0].payload : null;
}

async function cloudSave(data){
  var url = SUPABASE_URL.replace(/\/$/, "") + "/rest/v1/reportbox_data";
  var res = await fetch(url, {
    method:"POST",
    headers:cloudHeaders({"Prefer":"resolution=merge-duplicates,return=minimal"}),
    body:JSON.stringify([{id:CLOUD_ROW_ID, payload:data, updated_at:new Date().toISOString()}])
  });
  if(!res.ok){
    var detail = await res.text().catch(function(){ return ""; });
    throw new Error("Cloud save failed (" + res.status + ") " + detail);
  }
}

function readLocalBackup(){
  try{
    var saved = localStorage.getItem(DATA_KEY);
    return saved ? JSON.parse(saved) : null;
  }catch(e){
    console.warn("Local backup could not be read:", e);
    return null;
  }
}

function writeLocalBackup(){
  try{ localStorage.setItem(DATA_KEY, JSON.stringify(state.data)); }
  catch(e){ console.warn("Local backup could not be written:", e); }
}

async function loadData(){
  var defaults = {vehicles:[],reports:[],users:{},loginHistory:[]};
  if(!cloudConfigured()){
    var localOnly = readLocalBackup();
    if(localOnly) state.data = Object.assign(defaults, localOnly);
    state.loading = false;
    console.warn("Supabase is not configured. Data is local-only until you add the Supabase URL and anon key.");
    return;
  }

  try{
    var cloudData = await cloudGet();
    if(cloudData && typeof cloudData === "object"){
      state.data = Object.assign(defaults, cloudData);
      writeLocalBackup();
    }else{
      /* First cloud launch: migrate existing laptop/browser data if available. */
      var localData = readLocalBackup();
      if(localData){
        state.data = Object.assign(defaults, localData);
        await cloudSave(state.data);
      }
    }
  }catch(e){
    console.error("Cloud load failed:", e);
    var fallback = readLocalBackup();
    if(fallback) state.data = Object.assign(defaults, fallback);
    showToast("Cloud connection failed — using local backup", "err");
  }
  state.loading = false;
}

function saveData(){
  writeLocalBackup();
  if(!cloudConfigured()) return Promise.resolve();
  return cloudSave(state.data).catch(function(e){
    console.error("Failed to sync data to cloud:", e);
    showToast("Saved locally, but cloud sync failed", "err");
    return Promise.reject(e);
  });
}

/* ============ HELPERS ============ */
function showToast(msg, kind){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (kind ? " " + kind : "");
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.className = "toast"; }, 2400);
}
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function toCents(n){ return Math.round((parseFloat(n)||0) * 100); }
function money(cents){
  var neg = cents < 0;
  var v = (Math.abs(cents)/100).toFixed(2);
  return (neg ? "-" : "") + "₹" + v;
}
function nowStamp(){
  var d = new Date();
  return d.toLocaleString(undefined, {day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit"});
}
function todayISO(){
  var d = new Date();
  return d.toISOString().slice(0,10);
}
function navigate(view, push){
  if(push !== false) state.stack.push(state.view);
  state.view = view;
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}
function goBack(fallback){
  var prev = state.stack.pop();
  state.view = prev || fallback || "home";
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

/* ============ AUTH ============ */
function attemptLogin(name, pass){
  name = (name||"").trim();
  if(!name || !pass) return {ok:false, msg:"Enter both name and password."};
  if(name === "SUDEEP" && pass === "SUDEEP@0"){
    return {ok:true, user:{name:"SUDEEP", canEdit:true}};
  }
  var rec = state.data.users[name];
  if(rec && rec.password === pass){
    return {ok:true, user:{name:name, canEdit:false}};
  }
  return {ok:false, msg:"Invalid name or password."};
}
function attemptRegister(name, pass){
  name = (name||"").trim();
  if(!name || !pass) return {ok:false, msg:"Enter both name and password."};
  if(name === "SUDEEP") return {ok:false, msg:"That name is reserved."};
  if(pass.length < 4) return {ok:false, msg:"Password should be at least 4 characters."};
  if(state.data.users[name]) return {ok:false, msg:"That name is already taken."};
  state.data.users[name] = {password:pass};
  saveData();
  return {ok:true};
}
function recordLogin(name){
  state.data.loginHistory.unshift({name:name, at:Date.now(), display:nowStamp()});
  if(state.data.loginHistory.length > 200) state.data.loginHistory.length = 200;
  saveData();
}

/* ============ ROW HELPERS (generic infinite-row tables) ============ */
function ensureTrailingEmpty(list, emptyCheckFn, makeEmptyFn){
  if(list.length === 0 || !emptyCheckFn(list[list.length-1])){
    list.push(makeEmptyFn());
  }
}
function renumber(list){
  list.forEach(function(r,i){ r.sno = i+1; });
}

/* ============ RENDER ROOT ============ */
function render(){
  var app = document.getElementById("app");
  if(state.loading){
    app.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;">Loading Report Box…</div>';
    return;
  }
  if(!state.user){
    app.innerHTML = renderLogin();
    bindLogin();
    return;
  }
  var html = '<div class="topbar">' + renderTopbar() + '</div><div class="view">' + renderView() + '</div>';
  app.innerHTML = html;
  bindGlobal();
  bindView();
}

function renderTopbar(){
  return '' +
  '<div class="brand"><div class="bx"><span>SV</span></div><div>Report Box<small>SV Sudeep Car Wash</small></div></div>' +
  '<div class="session">' +
    '<span class="tag ' + (state.user.canEdit ? "admin" : "viewer") + '">' + (state.user.canEdit ? "Full Access" : "View Only") + '</span>' +
    '<span>' + esc(state.user.name) + '</span>' +
    '<button class="logout" data-action="logout">Sign out</button>' +
  '</div>';
}

function renderView(){
  switch(state.view){
    case "home": return renderHome();
    case "vehicles": return renderVehicles();
    case "logs": return renderLogsMenu();
    case "reports": return renderReports();
    case "dashboard": return renderDashboardMenu();
    case "summary-menu": return renderSummaryMenu();
    case "summary-result": return renderSummaryResult();
    case "history": return renderHistory();
    case "graph": return renderGraph();
    default: return renderHome();
  }
}

/* ============ LOGIN VIEW ============ */
function renderLogin(){
  var bubbleHtml = "";
  for(var i=0;i<10;i++){
    var size = 6 + Math.random()*16;
    var left = Math.random()*100;
    var dur = 6 + Math.random()*8;
    var delay = Math.random()*8;
    var drift = (Math.random()*40-20).toFixed(0)+"px";
    bubbleHtml += '<div class="bubble" style="width:'+size+'px;height:'+size+'px;left:'+left+'%;animation-duration:'+dur+'s;animation-delay:-'+delay+'s;--drift:'+drift+';"></div>';
  }
  return '' +
  '<div class="login-wrap">' +
    '<div class="gate-glow"></div>' +
    '<div class="bubbles">' + bubbleHtml + '</div>' +
    '<div class="login-card">' +
      '<div class="login-logo">' +
        '<div class="bx-lg"><span>SV</span></div>' +
        '<h1>Report Box</h1>' +
        '<p>SV Sudeep Car Wash — vehicle logs &amp; business reporting</p>' +
      '</div>' +
      '<div class="tabs">' +
        '<button class="tab ' + (loginMode==="login"?"active":"") + '" data-mode="login">Sign in</button>' +
        '<button class="tab ' + (loginMode==="register"?"active":"") + '" data-mode="register">Register</button>' +
      '</div>' +
      '<div class="err-msg" id="authErr"></div>' +
      '<div class="ok-msg" id="authOk"></div>' +
      '<div class="form-row"><label class="field-label">Name</label><input class="input" id="authName" placeholder="Your name" autocomplete="username"></div>' +
      '<div class="form-row"><label class="field-label">Password</label><input class="input" id="authPass" type="password" placeholder="Your password" autocomplete="current-password"></div>' +
      '<button class="btn primary" id="authSubmit" style="width:100%;">' + (loginMode==="login"?"Sign in":"Create account") + '</button>' +
      '<div class="hint">Full-access admin credentials are provisioned separately.<br>Other accounts get view-only access.</div>' +
    '</div>' +
  '</div>';
}
function bindLogin(){
  document.querySelectorAll(".tab").forEach(function(t){
    t.addEventListener("click", function(){
      loginMode = t.getAttribute("data-mode");
      render();
    });
  });
  var err = document.getElementById("authErr");
  var ok = document.getElementById("authOk");
  document.getElementById("authSubmit").addEventListener("click", submit);
  document.getElementById("authPass").addEventListener("keydown", function(e){ if(e.key==="Enter") submit(); });
  function submit(){
    var name = document.getElementById("authName").value;
    var pass = document.getElementById("authPass").value;
    err.className = "err-msg"; ok.className = "ok-msg";
    if(loginMode === "register"){
      var r = attemptRegister(name, pass);
      if(!r.ok){ err.textContent = r.msg; err.className = "err-msg show"; return; }
      ok.textContent = "Account created — you can sign in now.";
      ok.className = "ok-msg show";
      loginMode = "login";
      setTimeout(render, 900);
      return;
    }
    var res = attemptLogin(name, pass);
    if(!res.ok){ err.textContent = res.msg; err.className = "err-msg show"; return; }
    playGateThenEnter(res.user);
  }
}
function playGateThenEnter(user){
  var overlay = document.createElement("div");
  overlay.className = "gate-overlay";
  overlay.innerHTML = '<div class="gate-bar"></div><div class="gate-txt">ACCESS GRANTED — WELCOME ' + esc(user.name.toUpperCase()) + '</div>';
  document.body.appendChild(overlay);
  setTimeout(function(){
    state.user = user;
    recordLogin(user.name);
    state.view = "home";
    state.stack = [];
    render();
    setTimeout(function(){ overlay.style.transition = "opacity .4s ease"; overlay.style.opacity = "0"; setTimeout(function(){overlay.remove();}, 420); }, 250);
  }, 950);
}

/* ============ VEHICLE DETAILS ============ */
function vEmpty(){ return {sno:0, name:"", enter:"", exit:"", amount:""}; }
function vIsEmpty(r){ return !r.name && !r.enter && !r.exit && !r.amount; }
function ensureVehicleRows(){
  ensureTrailingEmpty(state.data.vehicles, vIsEmpty, vEmpty);
  renumber(state.data.vehicles);
}
function renderVehicles(){
  ensureVehicleRows();
  var canEdit = state.user.canEdit;
  var rows = state.data.vehicles.map(function(r, idx){
    var isLast = idx === state.data.vehicles.length - 1 && vIsEmpty(r);
    return '<tr class="' + (isLast?"empty-row":"") + '" data-idx="' + idx + '">' +
      '<td><span class="sno-badge">' + r.sno + '</span></td>' +
      '<td><input class="cell-input" data-field="name" placeholder="e.g. Honda Activa" value="' + esc(r.name) + '" ' + (canEdit?'':'disabled') + '></td>' +
      '<td><input class="cell-input" type="time" data-field="enter" value="' + esc(r.enter) + '" ' + (canEdit?'':'disabled') + '></td>' +
      '<td><input class="cell-input" type="time" data-field="exit" value="' + esc(r.exit) + '" ' + (canEdit?'':'disabled') + '></td>' +
      '<td><input class="cell-input" type="number" step="0.01" min="0" placeholder="0.00" data-field="amount" value="' + esc(r.amount) + '" ' + (canEdit?'':'disabled') + '></td>' +
      '<td>' + (canEdit ? rowActions(idx, isLast) : '') + '</td>' +
    '</tr>';
  }).join("");

  return '' +
  '<div class="crumb">HOME / VEHICLE DETAILS</div>' +
  '<div class="section-head"><div><h2>Vehicle Details</h2><div class="sub">Track every vehicle that enters and exits</div></div></div>' +
  (canEdit ? '' : '<div class="viewer-note">👁 View-only access — sign in as the admin account to add or edit rows.</div>') +
  '<div class="table-wrap"><table><thead><tr>' +
    '<th>S.No</th><th>Vehicle Name / Type</th><th>Enter Time</th><th>Exit Time</th><th>Amount Paid</th><th></th>' +
  '</tr></thead><tbody id="vehicleBody">' + rows + '</tbody></table></div>' +
  '<div class="actions-row"><button class="btn ghost" data-nav-home="1">← Back to Home</button></div>';
}
function rowActions(idx, isLast){
  if(isLast){
    return '<div class="row-actions"><button class="icon-btn save" data-action="save-vehicle-row" data-idx="'+idx+'" title="Save row">✓</button></div>';
  }
  return '<div class="row-actions"><button class="icon-btn" data-action="delete-vehicle-row" data-idx="'+idx+'" title="Delete row">✕</button></div>';
}

  return '' +

  '<div class="section-head"><div><h2>Logs</h2><div class="sub">Choose where you want to go</div></div></div>' +
  '<div class="opt-grid">' +

}

/* ============ REPORTS ============ */
function repEmpty(){ return {sno:0, date:"", expenses:"", revenue:""}; }
function repIsEmpty(r){ return !r.date && !r.expenses && !r.revenue; }
function ensureReportRows(){
  ensureTrailingEmpty(state.data.reports, repIsEmpty, repEmpty);
  renumber(state.data.reports);
}
function profitOf(r){
  return toCents(r.revenue) - toCents(r.expenses);
}
function renderReports(){
  ensureReportRows();
  var canEdit = state.user.canEdit;
  var rows = state.data.reports.map(function(r, idx){
    var isLast = idx === state.data.reports.length - 1 && repIsEmpty(r);
    var p = profitOf(r);
    var pStr = isLast ? "—" : money(p);
    return '<tr class="' + (isLast?"empty-row":"") + '" data-idx="' + idx + '">' +
      '<td><span class="sno-badge">' + r.sno + '</span></td>' +
      '<td><input class="cell-input" type="date" data-field="date" value="' + esc(r.date) + '" ' + (canEdit?'':'disabled') + '></td>' +
      '<td><input class="cell-input" type="number" step="0.01" min="0" placeholder="0.00" data-field="expenses" value="' + esc(r.expenses) + '" ' + (canEdit?'':'disabled') + '></td>' +
      '<td><input class="cell-input" type="number" step="0.01" min="0" placeholder="0.00" data-field="revenue" value="' + esc(r.revenue) + '" ' + (canEdit?'':'disabled') + '></td>' +
      '<td><span class="profit-val ' + (p>=0?"pos":"neg") + '">' + pStr + '</span></td>' +
      '<td>' + (canEdit ? rowActionsRep(idx, isLast) : '') + '</td>' +
    '</tr>';
  }).join("");

  return '' +
  '<div class="crumb">HOME / LOGS / REPORTS</div>' +
  '<div class="section-head"><div><h2>Reports</h2><div class="sub">Profit is calculated automatically as Revenue − Expenses</div></div></div>' +
  (canEdit ? '' : '<div class="viewer-note">👁 View-only access — sign in as the admin account to add or edit rows.</div>') +
  '<div class="table-wrap"><table><thead><tr>' +
    '<th>S.No</th><th>Date</th><th>Expenses</th><th>Revenue</th><th>Profit</th><th></th>' +
  '</tr></thead><tbody id="reportBody">' + rows + '</tbody></table></div>' +
  '<div class="actions-row"><button class="btn ghost" data-nav="logs">← Back</button><button class="btn ghost" data-nav-home="1">Home</button></div>';
}
function rowActionsRep(idx, isLast){
  if(isLast){
    return '<div class="row-actions"><button class="icon-btn save" data-action="save-report-row" data-idx="'+idx+'" title="Save row">✓</button></div>';
  }
  return '<div class="row-actions"><button class="icon-btn" data-action="delete-report-row" data-idx="'+idx+'" title="Delete row">✕</button></div>';
}

/* ============ DASHBOARD MENU ============ */

  return '' +
  '<div class="crumb">HOME / LOGS / DASHBOARD</div>' +
  '<div class="section-head"><div><h2>Dashboard</h2><div class="sub">Insights across all your reports</div></div></div>' +

    '<button class="opt-card" data-nav="graph"><span class="icon">📉</span><h3>Graphical Way</h3><p>Revenue vs expenses vs profit</p></button>' +
    '<button class="opt-card" data-nav-home="1"><span class="icon">🚪</span><h3>Exit</h3><p>Return to home page</p></button>' +
  '</div>' +

/* ============ SUMMARY MENU ============ */
var customFrom = "", customTo = "";
function renderSummaryMenu(){
  return '' +
  '<div class="crumb">HOME / LOGS / DASHBOARD / REPORT SUMMARY</div>' +
  '<div class="section-head"><div><h2>Report Summary</h2><div class="sub">Pick a period to see revenue, expenses and profit</div></div></div>' +
  '<div class="opt-grid cols-4">' +
    '<button class="opt-card" data-summary="today"><span class="icon">☀️</span><h3>Today</h3><p>' + todayISO() + '</p></button>' +
    '<button class="opt-card" data-summary="week"><span class="icon">📅</span><h3>This Week</h3><p>Monday – Sunday</p></button>' +
    '<button class="opt-card" data-summary="month"><span class="icon">🗓️</span><h3>This Month</h3><p>Calendar month</p></button>' +
    '<button class="opt-card" data-summary="custom"><span class="icon">🎯</span><h3>Custom</h3><p>Pick your own dates</p></button>' +
  '</div>' +
  '<div id="customRange" style="display:none; margin-top:20px;">' +
    '<div class="range-row">' +
      '<div class="form-row"><label class="field-label">From</label><input class="input" type="date" id="rangeFrom" value="' + esc(customFrom) + '"></div>' +
      '<div class="form-row"><label class="field-label">To</label><input class="input" type="date" id="rangeTo" value="' + esc(customTo) + '"></div>' +
      '<button class="btn primary" id="rangeGo">View Summary</button>' +
    '</div>' +
  '</div>' +
  '<div class="actions-row"><button class="btn ghost" data-nav="dashboard">← Back</button><button class="btn ghost" data-nav-home="1">Home</button></div>';
}

/* ============ SUMMARY RESULT ============ */
var lastSummary = null; // {label, from, to}
function computeSummary(from, to){
  var revC = 0, expC = 0, count = 0;
  state.data.reports.forEach(function(r){
    if(repIsEmpty(r) || !r.date) return;
    if(r.date >= from && r.date <= to){
      revC += toCents(r.revenue);
      expC += toCents(r.expenses);
      count++;
    }
  });
  return {revC:revC, expC:expC, profitC: revC - expC, count:count};
}
function weekRange(){
  var d = new Date();
  var day = (d.getDay() + 6) % 7; // Mon=0
  var mon = new Date(d); mon.setDate(d.getDate() - day);
  var sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  return [mon.toISOString().slice(0,10), sun.toISOString().slice(0,10)];
}
function monthRange(){
  var d = new Date();
  var first = new Date(d.getFullYear(), d.getMonth(), 1);
  var last = new Date(d.getFullYear(), d.getMonth()+1, 0);
  return [first.toISOString().slice(0,10), last.toISOString().slice(0,10)];
}
function renderSummaryResult(){
  if(!lastSummary) return renderSummaryMenu();
  var s = computeSummary(lastSummary.from, lastSummary.to);
  var isProfit = s.profitC >= 0;
  return '' +
  '<div class="crumb">HOME / LOGS / DASHBOARD / REPORT SUMMARY / ' + esc(lastSummary.label.toUpperCase()) + '</div>' +
  '<div class="section-head"><div><h2>' + esc(lastSummary.label) + ' Summary</h2><div class="sub">' + lastSummary.from + ' → ' + lastSummary.to + ' · ' + s.count + ' entr' + (s.count===1?'y':'ies') + '</div></div></div>' +
  '<div class="pl-banner ' + (isProfit?"pos":"neg") + '">' + (isProfit ? "▲ Profit for this period" : "▼ Loss for this period") + '</div>' +
  '<div class="stat-grid">' +
    '<div class="stat-card rev"><div class="label">Revenue</div><div class="val">' + money(s.revC) + '</div></div>' +
    '<div class="stat-card exp"><div class="label">Expenses</div><div class="val">' + money(s.expC) + '</div></div>' +
    '<div class="stat-card pl"><div class="label">Profit / Loss</div><div class="val ' + (isProfit?"pos":"neg") + '">' + money(s.profitC) + '</div></div>' +
  '</div>' +
  '<div class="actions-row"><button class="btn ghost" data-nav="summary-menu">← Back</button><button class="btn ghost" data-nav-home="1">Home</button></div>';
}

/* ============ HISTORY ============ */
function renderHistory(){
  var items = state.data.loginHistory;
  var rows = items.length ? items.map(function(h){
    return '<div class="history-item"><div class="who"><div class="avatar">' + esc(h.name.slice(0,2).toUpperCase()) + '</div><span>' + esc(h.name) + '</span></div><span class="when">' + esc(h.display) + '</span></div>';
  }).join("") : '<div class="empty-note">No sign-ins recorded yet.</div>';
  return '' +
  '<div class="crumb">HOME / LOGS / DASHBOARD / HISTORY</div>' +
  '<div class="section-head"><div><h2>Login History</h2><div class="sub">' + items.length + ' recorded sign-in' + (items.length===1?'':'s') + '</div></div></div>' +
  '<div class="history-list">' + rows + '</div>' +
  '<div class="actions-row"><button class="btn ghost" data-nav="dashboard">← Back</button><button class="btn ghost" data-nav-home="1">Home</button></div>';
}

/* ============ GRAPH ============ */
function renderGraph(){
  var months = [];
  var now = new Date();
  for(var i=5;i>=0;i--){
    var d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({key:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"), label:d.toLocaleString(undefined,{month:"short"}), revC:0, expC:0});
  }
  state.data.reports.forEach(function(r){
    if(repIsEmpty(r) || !r.date) return;
    var key = r.date.slice(0,7);
    var m = months.find(function(mm){ return mm.key === key; });
    if(m){ m.revC += toCents(r.revenue); m.expC += toCents(r.expenses); }
  });
  var maxV = Math.max(1, ...months.map(function(m){ return Math.max(m.revC, m.expC, Math.abs(m.revC-m.expC)); }));
  var W = 640, H = 240, padL = 40, padB = 30, padT = 10;
  var groupW = (W - padL - 20) / months.length;
  var barW = groupW / 4;
  var scale = function(v){ return (v/maxV) * (H - padB - padT); };

  var bars = months.map(function(m, i){
    var x0 = padL + i*groupW + groupW*0.15;
    var revH = scale(m.revC), expH = scale(m.expC), profitVal = m.revC - m.expC, profH = scale(Math.abs(profitVal));
    var baseY = H - padB;
    var profColor = profitVal >= 0 ? "#3ED598" : "#FF5D6C";
    return '' +
      '<rect class="bar" x="'+x0+'" y="'+(baseY-revH)+'" width="'+barW+'" height="'+revH+'" fill="#F5A623" rx="2"/>' +
      '<rect class="bar" x="'+(x0+barW+4)+'" y="'+(baseY-expH)+'" width="'+barW+'" height="'+expH+'" fill="#5B6478" rx="2"/>' +
      '<rect class="bar" x="'+(x0+2*(barW+4))+'" y="'+(baseY-profH)+'" width="'+barW+'" height="'+profH+'" fill="'+profColor+'" rx="2"/>' +
      '<text class="axis-label" x="'+(x0+barW*1.5+4)+'" y="'+(H-10)+'" text-anchor="middle">'+m.label+'</text>';
  }).join("");

  var svg = '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">' +
    '<line x1="'+padL+'" y1="'+(H-padB)+'" x2="'+(W-10)+'" y2="'+(H-padB)+'" stroke="#2A3450" stroke-width="1"/>' +
    bars +
  '</svg>';

  return '' +
  '<div class="crumb">HOME / LOGS / DASHBOARD / GRAPHICAL WAY</div>' +
  '<div class="section-head"><div><h2>Graphical Overview</h2><div class="sub">Last 6 months · Revenue, expenses &amp; profit/loss</div></div></div>' +
  '<div class="chart-legend">' +
    '<div class="legend-item"><span class="legend-dot" style="background:#F5A623;"></span>Revenue</div>' +
    '<div class="legend-item"><span class="legend-dot" style="background:#5B6478;"></span>Expenses</div>' +
    '<div class="legend-item"><span class="legend-dot" style="background:#3ED598;"></span>Profit</div>' +
    '<div class="legend-item"><span class="legend-dot" style="background:#FF5D6C;"></span>Loss</div>' +
  '</div>' +
  '<div class="chart-svg-wrap">' + svg + '</div>' +
  '<div class="actions-row"><button class="btn ghost" data-nav="dashboard">← Back</button><button class="btn ghost" data-nav-home="1">Home</button></div>';
}

/* ============ BIND: GLOBAL (topbar + nav) ============ */
function bindGlobal(){
  var out = document.querySelector("[data-action='logout']");
  if(out) out.addEventListener("click", function(){
    state.user = null; state.view = "login"; state.stack = [];
    render();
  });
}

/* ============ BIND: PER VIEW ============ */
function bindView(){
  document.querySelectorAll("[data-nav]").forEach(function(b){
    b.addEventListener("click", function(){ navigate(b.getAttribute("data-nav")); });
  });
  document.querySelectorAll("[data-nav-home]").forEach(function(b){
    b.addEventListener("click", function(){ state.stack = []; navigate("home", false); });
  });

  if(state.view === "vehicles") bindVehicles();
  if(state.view === "reports") bindReports();
  if(state.view === "summary-menu") bindSummaryMenu();
  if(state.view === "dashboard") {} // handled by data-nav
}

function bindVehicles(){
  var body = document.getElementById("vehicleBody");
  if(!body) return;
  body.querySelectorAll("input[data-field]").forEach(function(inp){
    inp.addEventListener("change", function(){
      var idx = parseInt(inp.closest("tr").getAttribute("data-idx"), 10);
      var field = inp.getAttribute("data-field");
      state.data.vehicles[idx][field] = inp.value;
      var row = state.data.vehicles[idx];
      if(!vIsEmpty(row) && idx === state.data.vehicles.length - 1){
        // still last-empty until explicit save; just persist silently
        saveData();
      } else {
        saveData();
        showToast("Row updated", "ok");
      }
    });
  });
  body.querySelectorAll("[data-action='save-vehicle-row']").forEach(function(btn){
    btn.addEventListener("click", function(){
      var idx = parseInt(btn.getAttribute("data-idx"), 10);
      var row = state.data.vehicles[idx];
      if(vIsEmpty(row)){ showToast("Add at least one detail before saving", "err"); return; }
      saveData();
      showToast("Row saved", "ok");
      render();
    });
  });
  body.querySelectorAll("[data-action='delete-vehicle-row']").forEach(function(btn){
    btn.addEventListener("click", function(){
      var idx = parseInt(btn.getAttribute("data-idx"), 10);
      state.data.vehicles.splice(idx, 1);
      renumber(state.data.vehicles);
      saveData();
      showToast("Row deleted", "ok");
      render();
    });
  });
}

function bindReports(){
  var body = document.getElementById("reportBody");
  if(!body) return;
  body.querySelectorAll("input[data-field]").forEach(function(inp){
    inp.addEventListener("change", function(){
      var idx = parseInt(inp.closest("tr").getAttribute("data-idx"), 10);
      var field = inp.getAttribute("data-field");
      state.data.reports[idx][field] = inp.value;
      saveData();
      render();
    });
  });
  body.querySelectorAll("[data-action='save-report-row']").forEach(function(btn){
    btn.addEventListener("click", function(){
      var idx = parseInt(btn.getAttribute("data-idx"), 10);
      var row = state.data.reports[idx];
      if(repIsEmpty(row)){ showToast("Add date, expenses or revenue before saving", "err"); return; }
      saveData();
      showToast("Report entry saved", "ok");
      render();
    });
  });
  body.querySelectorAll("[data-action='delete-report-row']").forEach(function(btn){
    btn.addEventListener("click", function(){
      var idx = parseInt(btn.getAttribute("data-idx"), 10);
      state.data.reports.splice(idx, 1);
      renumber(state.data.reports);
      saveData();
      showToast("Entry deleted", "ok");
      render();
    });
  });
}

function bindSummaryMenu(){
  document.querySelectorAll("[data-summary]").forEach(function(b){
    b.addEventListener("click", function(){
      var kind = b.getAttribute("data-summary");
      if(kind === "custom"){
        document.getElementById("customRange").style.display = "block";
        return;
      }
      var from, to, label;
      if(kind === "today"){ from = to = todayISO(); label = "Today's"; }
      if(kind === "week"){ var wr = weekRange(); from = wr[0]; to = wr[1]; label = "This Week's"; }
      if(kind === "month"){ var mr = monthRange(); from = mr[0]; to = mr[1]; label = "This Month's"; }
      lastSummary = {label:label, from:from, to:to};
      navigate("summary-result");
    });
  });
  var go = document.getElementById("rangeGo");
  if(go) go.addEventListener("click", function(){
    var f = document.getElementById("rangeFrom").value;
    var t = document.getElementById("rangeTo").value;
    if(!f || !t){ showToast("Pick both dates", "err"); return; }
    if(f > t){ showToast("From date must be before To date", "err"); return; }
    customFrom = f; customTo = t;
    lastSummary = {label:"Custom", from:f, to:t};
    navigate("summary-result");
  });
}

/* ============ INIT ============ */
async function init(){
  await loadData();
  render();
}
init();

})();
</script>
