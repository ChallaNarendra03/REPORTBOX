<!DOCTYPE html>
>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Box</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
 
:root{
  --bg:#130E20;
  --bg-2:#181129;
  --panel:#1D1633;
  --panel-2:#251C3E;
  --border:rgba(241,238,248,0.09);
  --border-strong:rgba(241,238,248,0.17);
  --text:#F1EEF8;
  --muted:#A79FC0;
  --muted-2:#6E6690;
  --amber:#D98C4A;
  --amber-dim:#A8672F;
  --water:#4FC6EF;
  --gold:#D8AE52;
  --rose:#FF4D6D;
  --profit:#3ED598;
  --loss:#FF5D6C;
  --radius-sm:8px;
  --radius:14px;
  --radius-lg:22px;
}
:root[data-theme="light"]{
  --bg:#F4F1FA;
  --bg-2:#FFFFFF;
  --panel:#FFFFFF;
  --panel-2:#F0ECFA;
  --border:rgba(20,15,35,0.08);
  --border-strong:rgba(20,15,35,0.16);
  --text:#1C1730;
  --muted:#5B5573;
  --muted-2:#88819E;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 600px at 50% -10%, var(--panel-2) 0%, transparent 60%),
    radial-gradient(900px 500px at 90% 10%, rgba(217,140,74,0.07) 0%, transparent 60%),
    radial-gradient(700px 500px at 6% 30%, rgba(79,198,239,0.05) 0%, transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:'IBM Plex Mono', monospace;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  transition:background .2s ease, color .2s ease;
}
h1,h2,h3,.display{font-family:'Space Grotesk', sans-serif;}
#app{min-height:100vh; display:flex; flex-direction:column;}
::selection{background:var(--amber); color:#0A0F1C;}
a{color:inherit;}
button{font-family:inherit; cursor:pointer;}
input, select{font-family:inherit;}
:focus-visible{outline:2px solid var(--amber); outline-offset:2px;}
 
.view{width:100%; max-width:1020px; margin:0 auto; padding:28px 20px 64px; flex:1; animation:viewIn .5s ease both;}
@keyframes viewIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
.topbar{
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
  padding:14px 24px; border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:20;
  background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px);
}
.brand{display:flex; align-items:center; gap:10px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; letter-spacing:0.2px;}
.brand .bx{
  width:26px;height:26px;border-radius:50% 50% 50% 4px;
  background:linear-gradient(135deg,var(--rose),var(--amber));
  display:flex;align-items:center;justify-content:center;
  color:#fff; font-size:13px; font-weight:700; transform:rotate(45deg);
  box-shadow:0 4px 12px -3px rgba(255,77,109,0.5);
}
.brand .bx span{transform:rotate(-45deg); display:block;}
.brand small{display:block; font-size:10px; color:var(--muted-2); font-weight:500; letter-spacing:0.3px; margin-top:1px;}
.session{display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--muted); flex-wrap:wrap;}
.tag{padding:4px 10px; border-radius:999px; font-size:11px; font-weight:600; border:1px solid var(--border-strong); letter-spacing:0.3px;}
.tag.admin{color:var(--amber); border-color:rgba(245,166,35,0.35); background:rgba(245,166,35,0.08);}
.tag.viewer{color:var(--muted);}
.logout, .theme-toggle{background:transparent; border:1px solid var(--border-strong); color:var(--muted); padding:6px 12px; border-radius:8px; font-size:12px; transition:all .18s ease;}
.logout:hover, .theme-toggle:hover{color:var(--text); border-color:var(--muted);}
.theme-toggle{width:32px; height:32px; padding:0; display:flex; align-items:center; justify-content:center; font-size:14px;}
 
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:13px 22px; border-radius:11px; border:1px solid var(--border-strong); background:var(--panel-2); color:var(--text); font-size:14px; font-weight:600; transition:transform .15s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease;}
.btn:hover{transform:translateY(-2px); border-color:var(--amber); box-shadow:0 8px 24px -12px rgba(245,166,35,0.35);}
.btn:active{transform:translateY(0);}
.btn.primary{background:linear-gradient(135deg,var(--amber),#e0901a); color:#241703; border-color:transparent;}
.btn.primary:hover{box-shadow:0 10px 28px -10px rgba(245,166,35,0.55);}
.btn.ghost{background:transparent;}
.btn.danger{color:var(--loss); border-color:rgba(255,93,108,0.35); background:rgba(255,93,108,0.06);}
.btn.danger:hover{border-color:var(--loss); box-shadow:0 8px 22px -12px rgba(255,93,108,0.4);}
.btn.small{padding:8px 14px; font-size:12.5px; border-radius:8px;}
.btn:disabled{opacity:0.4; cursor:not-allowed; transform:none; box-shadow:none;}
 
.panel{background:linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--border); border-radius:var(--radius-lg); padding:26px;}
.field-label{font-size:11px; text-transform:uppercase; letter-spacing:1.2px; color:var(--muted-2); margin-bottom:7px; display:block; font-family:'Space Grotesk',sans-serif; font-weight:600;}
.input{width:100%; padding:11px 13px; border-radius:9px; border:1px solid var(--border-strong); background:var(--bg-2); color:var(--text); font-size:13.5px; transition:border-color .15s ease, background .15s ease;}
.input:focus{border-color:var(--amber);}
.input::placeholder{color:var(--muted-2);}
.input-wrap{position:relative;display:flex;align-items:center;}
.input-wrap .input{padding-right:44px;}
.password-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;background:transparent;color:var(--muted);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;}
.password-toggle:hover{background:rgba(120,120,120,.12);color:var(--text);}
.select-input{width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--border-strong);background:var(--bg-2);color:var(--text);font-size:13.5px;}
.select-input:focus{border-color:var(--amber);outline:none;}
.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
@media(max-width:700px){.settings-grid{grid-template-columns:1fr;}}
.settings-card{padding:22px;border:1px solid var(--border-strong);border-radius:16px;background:linear-gradient(160deg,var(--panel-2),var(--panel));}
.settings-card h3{margin:0 0 7px;font-size:17px;}
.settings-card p{margin:0 0 18px;color:var(--muted);font-size:12px;line-height:1.6;}
.access-row{display:grid;grid-template-columns:1.2fr 1fr 110px;gap:12px;align-items:end;padding:14px 0;border-bottom:1px solid var(--border);}
.access-row:last-child{border-bottom:0;}
@media(max-width:700px){.access-row{grid-template-columns:1fr;}}
.access-name{font-family:'Space Grotesk',sans-serif;font-weight:700;}
.access-meta{font-size:11px;color:var(--muted-2);margin-top:3px;}
.security-strip{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-bottom:18px;border:1px solid rgba(79,198,239,.2);background:rgba(79,198,239,.05);border-radius:11px;color:var(--muted);font-size:11.5px;line-height:1.5;}
.security-strip strong{color:var(--text);}
.vehicle-form-note{margin-top:8px;font-size:10.5px;color:var(--muted-2);}
.table-wrap.vehicle-table{overflow-x:auto;}
.table-wrap.vehicle-table table{min-width:880px;}
 
.login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; position:relative; overflow:hidden;}
.gate-glow{position:absolute; width:560px; height:560px; border-radius:50%; background:radial-gradient(circle, rgba(217,140,74,0.13), rgba(79,198,239,0.06) 45%, transparent 68%); top:-150px; left:50%; transform:translateX(-50%); pointer-events:none;}
.login-card{width:100%; max-width:400px; position:relative; z-index:2; background:linear-gradient(180deg, var(--panel), var(--panel-2)); border:1px solid var(--border-strong); border-radius:var(--radius-lg); padding:34px 30px; box-shadow:0 30px 80px -30px rgba(0,0,0,0.6);}
.login-top{display:flex; justify-content:flex-end; margin-bottom:-6px;}
.login-logo{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:22px;}
.login-logo .bx-lg{width:56px;height:56px;border-radius:50% 50% 50% 6px;background:linear-gradient(135deg,var(--rose),var(--amber));display:flex;align-items:center;justify-content:center; color:#fff; font-size:26px; font-weight:700;box-shadow:0 12px 30px -10px rgba(255,77,109,0.5); transform:rotate(45deg);}
.login-logo .bx-lg span{transform:rotate(-45deg); display:block;}
.login-logo h1{margin:0; font-size:20px; letter-spacing:0.3px;}
.login-logo p{margin:0; font-size:12px; color:var(--muted); letter-spacing:0.4px; text-align:center;}
.tabs{display:flex; border:1px solid var(--border-strong); border-radius:10px; padding:3px; margin-bottom:20px;}
.tab{flex:1; text-align:center; padding:8px 0; font-size:12.5px; font-weight:600; border-radius:8px; color:var(--muted); transition:all .18s ease; background:transparent; border:none;}
.tab.active{background:var(--amber); color:#241703;}
.form-row{margin-bottom:14px;}
.err-msg{background:rgba(255,93,108,0.08); border:1px solid rgba(255,93,108,0.3); color:var(--loss); font-size:12.5px; padding:10px 12px; border-radius:9px; margin-bottom:14px; display:none;}
.err-msg.show{display:block; animation:shake .35s ease;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
.ok-msg{background:rgba(62,213,152,0.08); border:1px solid rgba(62,213,152,0.3); color:var(--profit); font-size:12.5px; padding:10px 12px; border-radius:9px; margin-bottom:14px; display:none;}
.ok-msg.show{display:block;}
.hint{font-size:11px; color:var(--muted-2); margin-top:16px; text-align:center; line-height:1.6;}
 
.gate-overlay{position:fixed; inset:0; background:var(--bg); z-index:100; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:18px;}
.gate-bar{width:220px; height:14px; border-radius:7px; background:repeating-linear-gradient(45deg, var(--amber) 0 14px, #1a1206 14px 28px); transform-origin:left center; animation:gateLift 1s cubic-bezier(.5,0,.2,1) forwards;}
@keyframes gateLift{0%{transform:rotate(0deg);}100%{transform:rotate(-72deg) translateY(-4px);}}
.gate-txt{font-family:'Space Grotesk',sans-serif; font-size:13px; color:var(--muted); letter-spacing:1px; animation:fadeInSlow .6s ease;}
@keyframes fadeInSlow{from{opacity:0;}to{opacity:1;}}
 
.hero{text-align:center; padding:52px 12px 18px;}
.heart{font-size:34px; display:inline-block; animation:heartbeat 1.8s ease-in-out infinite; filter:drop-shadow(0 0 14px rgba(255,77,109,0.65));}
@keyframes heartbeat{0%,100%{transform:scale(1);}15%{transform:scale(1.22);}30%{transform:scale(1);}45%{transform:scale(1.16);}60%{transform:scale(1);}}
.hero h1{font-size:clamp(24px,5vw,40px); margin:14px 0 6px; letter-spacing:0.2px; background:linear-gradient(135deg,var(--text),var(--muted) 60%, var(--amber)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
.hero p{color:var(--muted); font-size:14px; margin:0;}
.hero-illustration{margin:34px auto 0; max-width:640px; position:relative; border-radius:22px; padding:10px; background:linear-gradient(160deg, rgba(217,140,74,0.35), rgba(79,198,239,0.18)); box-shadow:0 34px 80px -32px rgba(0,0,0,0.55);}
.hero-photo-frame{position:relative; border-radius:16px; overflow:hidden; isolation:isolate; min-height:180px; background:var(--panel-2); display:flex; align-items:center; justify-content:center;}
.hero-photo-frame img{display:block; width:100%; height:auto; filter:saturate(1.08) contrast(1.03);}
.hero-photo-frame .fallback{color:var(--muted-2); font-size:12px; padding:40px;}
.hero-caption{margin-top:16px; text-align:center;}
.hero-caption .biz-name{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; letter-spacing:0.3px; color:var(--text);}
.hero-caption .biz-sub{font-size:11.5px; color:var(--muted-2); margin-top:4px; line-height:1.7;}
.home-actions{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:38px;}
@media (max-width:620px){.home-actions{grid-template-columns:1fr;}}
.big-opt{padding:30px 22px; border-radius:18px; border:1px solid var(--border-strong); background:linear-gradient(160deg, var(--panel-2), var(--panel)); text-align:left; position:relative; overflow:hidden; transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease;}
.big-opt:hover{transform:translateY(-4px); border-color:var(--amber); box-shadow:0 20px 50px -24px rgba(245,166,35,0.4);}
.big-opt .icon{font-size:26px; margin-bottom:14px; display:block;}
.big-opt h3{font-size:19px; font-weight:700; letter-spacing:0.4px; text-transform:uppercase; margin:0 0 6px; position:relative;}
.big-opt p{color:var(--muted); font-size:12.5px; margin:0; position:relative;}
 
.section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; gap:12px; flex-wrap:wrap;}
.section-head h2{font-size:23px; margin:0; letter-spacing:0.2px;}
.section-head .sub{color:var(--muted); font-size:12.5px; margin-top:4px;}
.crumb{font-size:11.5px; color:var(--muted-2); letter-spacing:0.5px; margin-bottom:6px;}
 
.opt-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:16px;}
@media (max-width:620px){.opt-grid{grid-template-columns:1fr;}}
.opt-grid.cols-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:820px){.opt-grid.cols-4{grid-template-columns:repeat(2,1fr);}}
@media (max-width:460px){.opt-grid.cols-4{grid-template-columns:1fr;}}
.opt-card{padding:24px 20px; border-radius:16px; border:1px solid var(--border-strong); background:var(--panel-2); text-align:left; transition:all .18s ease;}
.opt-card:hover{transform:translateY(-3px); border-color:var(--amber);}
.opt-card .icon{font-size:22px;}
.opt-card h3{margin:10px 0 4px; font-size:15.5px;}
.opt-card p{margin:0; color:var(--muted); font-size:12px;}
 
.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--bg-2);}
table{width:100%; border-collapse:collapse; min-width:640px;}
thead th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:var(--muted-2); padding:14px 14px; border-bottom:1px solid var(--border-strong); font-family:'Space Grotesk',sans-serif; font-weight:600; background:var(--panel);}
tbody td{padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr.empty-row{background:rgba(245,166,35,0.02);}
tbody tr.filtered-out{display:none;}
tbody tr:hover{background:rgba(120,120,120,0.05);}
.cell-input{width:100%; min-width:90px; padding:8px 9px; border-radius:7px; border:1px solid transparent; background:transparent; color:var(--text); font-size:12.5px;}
.cell-input:hover{border-color:var(--border-strong);}
.cell-input:focus{border-color:var(--amber); background:var(--panel);}
.cell-input:disabled{color:var(--muted); cursor:default;}
select.cell-input{appearance:auto;}
.sno-badge{display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:7px; background:var(--panel); font-size:11px; color:var(--muted); border:1px solid var(--border-strong);}
.row-actions{display:flex; gap:6px; align-items:center; flex-wrap:nowrap; white-space:nowrap;}
.icon-btn{min-width:72px; height:30px; padding:0 8px; padding:0 7px; border-radius:7px; border:1px solid var(--border-strong); background:transparent; color:var(--muted); display:flex; align-items:center; justify-content:center; font-size:13px; transition:all .15s ease;}
.icon-btn:hover{border-color:var(--rose); color:var(--rose);}
.icon-btn.save{font-size:10px;font-weight:800;letter-spacing:.4px;}
.icon-btn.save:hover{border-color:var(--profit); color:var(--profit);}
.icon-btn.delete{font-size:10px;font-weight:800;letter-spacing:.4px;}
.icon-btn.edit{font-size:10px;font-weight:900;letter-spacing:.4px;color:var(--text);border-color:var(--border-strong);}
.profit-val{font-weight:700;}
.profit-val.pos{color:var(--profit);}
.profit-val.neg{color:var(--loss);}
.loss-val{font-weight:700;color:var(--loss);}
.empty-note{padding:16px; text-align:center; color:var(--muted-2); font-size:12px;}
 
.actions-row{display:flex; gap:12px; margin-top:22px; flex-wrap:wrap;}
 
.filter-bar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center;}
.filter-bar .input, .filter-bar .select-input{width:auto; min-width:160px; flex:1 1 160px;}
.filter-bar .btn{padding:10px 14px;}
.export-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
 
.stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:24px;}
@media (max-width:680px){.stat-grid{grid-template-columns:1fr;}}
.stat-grid.four{grid-template-columns:repeat(4,1fr);}
@media (max-width:820px){.stat-grid.four{grid-template-columns:repeat(2,1fr);}}
.stat-card{padding:20px; border-radius:15px; border:1px solid var(--border-strong); background:var(--panel-2);}
.stat-card .label{font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--muted-2); font-family:'Space Grotesk',sans-serif; font-weight:600;}
.stat-card .val{font-size:26px; font-weight:700; margin-top:8px; font-family:'Space Grotesk',sans-serif;}
.stat-card.rev .val{color:var(--amber);}
.stat-card.exp .val{color:var(--muted);}
.stat-card.pl .val.pos{color:var(--profit);}
.stat-card.pl .val.neg{color:var(--loss);}
.pl-banner{margin-bottom:22px; padding:16px 20px; border-radius:14px; font-weight:700; font-size:14px; display:flex; align-items:center; gap:10px; letter-spacing:0.3px;}
.pl-banner.pos{background:rgba(62,213,152,0.1); color:var(--profit); border:1px solid rgba(62,213,152,0.3);}
.pl-banner.neg{background:rgba(255,93,108,0.1); color:var(--loss); border:1px solid rgba(255,93,108,0.3);}
 
.range-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:24px; align-items:end;}
.range-row .form-row{margin:0; min-width:150px;}
 
.history-list{display:flex; flex-direction:column; gap:8px;}
.history-item{display:flex; align-items:center; justify-content:space-between; padding:13px 16px; border:1px solid var(--border); border-radius:11px; background:var(--panel-2); font-size:12.5px; gap:10px; flex-wrap:wrap;}
.history-item .who{display:flex; align-items:center; gap:10px;}
.avatar{width:28px; height:28px; border-radius:8px; background:linear-gradient(135deg,var(--amber),#e0901a); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:#241703; flex-shrink:0;}
.history-item .when{color:var(--muted-2);}
.history-item .detail{color:var(--muted); font-size:11.5px; width:100%;}
.action-pill{padding:2px 9px; border-radius:999px; font-size:10.5px; font-weight:600; border:1px solid var(--border-strong); color:var(--muted);}
.history-controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
.history-controls .btn{font-weight:800;text-transform:uppercase;letter-spacing:.7px;}
.history-check{width:17px;height:17px;accent-color:var(--loss);cursor:pointer;}
.history-select-cell{display:flex;align-items:center;justify-content:center;width:24px;}
.history-select-note{font-size:11px;color:var(--muted-2);margin-top:8px;}
 
.chart-legend{display:flex; gap:18px; margin-bottom:18px; flex-wrap:wrap;}
.legend-item{display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted);}
.legend-dot{width:9px; height:9px; border-radius:3px;}
.chart-svg-wrap{background:var(--bg-2); border:1px solid var(--border); border-radius:var(--radius); padding:20px 10px 8px; overflow-x:auto;}
.bar{transition:opacity .15s ease;}
.bar:hover{opacity:0.75;}
.axis-label{font-size:9.5px; fill:var(--muted-2); font-family:'IBM Plex Mono',monospace;}
 
.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); z-index:200; background:var(--panel-2); border:1px solid var(--border-strong); color:var(--text); padding:11px 18px; border-radius:10px; font-size:12.5px; opacity:0; transition:all .3s ease; display:flex; align-items:center; gap:8px; box-shadow:0 20px 40px -15px rgba(0,0,0,0.5);}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.toast.ok{border-color:rgba(62,213,152,0.4); color:var(--profit);}
.toast.err{border-color:rgba(255,93,108,0.4); color:var(--loss);}

<!-- Optional: enables the "Email Summary" button. GitHub Pages can't send email itself,
     so this uses EmailJS (a free client-side email API). Create a free account at
     emailjs.com, then fill in EMAILJS_PUBLIC_KEY / SERVICE_ID / TEMPLATE_ID below.
     Leave EMAILJS_PUBLIC_KEY empty to keep the button disabled. -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
 
<script>
(function(){
"use strict";
 
/* ============ STATE ============ */
var state = {
  view: "login",
  stack: [],
  user: null,
  loading: true,
  data: { vehicles: [], reports: [], users: {}, loginHistory: [], auditLog: [], ownerPasswordHash: "" }
};
var loginMode = "login";
var OWNER_NAME = "SUDEEP";
var DEFAULT_OWNER_PASSWORD = "SUDEEP@0";
var VEHICLE_TYPES = ["BIKE","CAR","TRACTOR","JCB","LORRY"];
 
/* Optional email reports (EmailJS - free, client-side, works on static hosting).
   Fill these in from your emailjs.com dashboard to enable the "Email Summary" button. */
var EMAILJS_PUBLIC_KEY = "";
var EMAILJS_SERVICE_ID = "";
var EMAILJS_TEMPLATE_ID = "";

function emailReportsConfigured(){

}
 
/* filter/search state (client-side only, resets on reload) */
var vehicleFilter = { search:"", type:"" };
var reportFilter = { from:"", to:"" };
var reportEditingIdx = null;
 
/* ============ CLOUD STORAGE (SUPABASE) ============ */
/*
  ONE-TIME SETUP:
  1. Create a free Supabase project.
  2. Run the SQL from supabase_setup.sql in the Supabase SQL editor.
  3. Put your Project URL and anon/public key below.
  Supabase's auto-generated REST API (PostgREST) is what fulfils the
  "REST API Backend" requirement here -- there is no separate server
  to host, which is exactly what a static GitHub Pages deploy needs.
*/
var SUPABASE_URL = "https://ulpfmqpbzmpmuetjcddj.supabase.co";
var SUPABASE_ANON_KEY = "sb_publishable_gXOv4sR2S223g3gy3kmCtA_1nqZb-3U";
var CLOUD_ROW_ID = 1;
 
function cloudConfigured(){
  return SUPABASE_URL.indexOf("YOUR_") !== 0 && SUPABASE_ANON_KEY.indexOf("YOUR_") !== 0;
}
function cloudHeaders(extra){
  return Object.assign({
    "apikey": SUPABASE_ANON_KEY,
    "Authorization": "Bearer " + SUPABASE_ANON_KEY,
    "Content-Type": "application/json"
  }, extra || {});
}
async function cloudGet(){
  var url = SUPABASE_URL.replace(/\/$/, "") + "/rest/v1/reportbox_data?id=eq." + CLOUD_ROW_ID + "&select=payload";
  var res = await fetch(url, {headers:cloudHeaders()});
  if(!res.ok) throw new Error("Cloud read failed (" + res.status + ")");
  var rows = await res.json();
  return rows.length ? rows[0].payload : null;
}
async function cloudSave(data){
  var url = SUPABASE_URL.replace(/\/$/, "") + "/rest/v1/reportbox_data";
  var res = await fetch(url, {
    method:"POST",
    headers:cloudHeaders({"Prefer":"resolution=merge-duplicates,return=minimal"}),
    body:JSON.stringify([{id:CLOUD_ROW_ID, payload:data, updated_at:new Date().toISOString()}])
  });
  if(!res.ok){
    var detail = await res.text().catch(function(){ return ""; });
    throw new Error("Cloud save failed (" + res.status + ") " + detail);
  }
}
function readLocalBackup(){
  try{ var saved = localStorage.getItem("reportbox-app-data"); return saved ? JSON.parse(saved) : null; }
  catch(e){ console.warn("Local backup could not be read:", e); return null; }
}
function writeLocalBackup(){
  try{ localStorage.setItem("reportbox-app-data", JSON.stringify(state.data)); }
  catch(e){ console.warn("Local backup could not be written:", e); }
}
async function loadData(){
  var defaults = {vehicles:[],reports:[],users:{},loginHistory:[],auditLog:[],ownerPasswordHash:""};
  if(!cloudConfigured()){
    var localOnly = readLocalBackup();
    if(localOnly) state.data = Object.assign(defaults, localOnly);
    state.loading = false;
    console.warn("Supabase is not configured. Data is local-only until you add the Supabase URL and anon key.");
    return;
  }
  try{
    var cloudData = await cloudGet();
    if(cloudData && typeof cloudData === "object"){
      state.data = Object.assign(defaults, cloudData);
      writeLocalBackup();
    }else{
      var localData = readLocalBackup();
      if(localData){ state.data = Object.assign(defaults, localData); await cloudSave(state.data); }
    }
  }catch(e){
    console.error("Cloud load failed:", e);
    var fallback = readLocalBackup();
    if(fallback) state.data = Object.assign(defaults, fallback);
    showToast("Cloud connection failed - using local backup", "err");
  }
  state.loading = false;
}
function saveData(){
  writeLocalBackup();
  if(!cloudConfigured()) return Promise.resolve();
  return cloudSave(state.data).catch(function(e){
    console.error("Failed to sync data to cloud:", e);
    showToast("Saved locally, but cloud sync failed", "err");
    return Promise.reject(e);
  });
}
 
/* ============ THEME (dark / light) ============ */
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  try{ localStorage.setItem("reportbox-theme", t); }catch(e){}
  document.querySelectorAll(".theme-toggle").forEach(function(b){ b.textContent = t === "dark" ? "\ud83c\udf19" : "\u2600\ufe0f"; });
}
function initTheme(){
  var saved = "dark";
  try{ saved = localStorage.getItem("reportbox-theme") || "dark"; }catch(e){}
  applyTheme(saved);
}
function toggleTheme(){
  var cur = document.documentElement.getAttribute("data-theme") || "dark";
  applyTheme(cur === "dark" ? "light" : "dark");
}
 
/* ============ SESSION / SECURITY HELPERS ============ */
async function hashPassword(password){
  if(window.crypto && crypto.subtle){
    var bytes = new TextEncoder().encode(password);
    var digest = await crypto.subtle.digest("SHA-256", bytes);
    return Array.from(new Uint8Array(digest)).map(function(b){ return b.toString(16).padStart(2,"0"); }).join("");
  }
  var h = 2166136261;
  for(var i=0;i<password.length;i++){ h ^= password.charCodeAt(i); h = Math.imul(h,16777619); }
  return "fallback-" + (h >>> 0).toString(16);
}
async function ensureOwnerPassword(){
  if(!state.data.ownerPasswordHash){
    state.data.ownerPasswordHash = await hashPassword(DEFAULT_OWNER_PASSWORD);
    await saveData();
  }
}
function saveSession(){
  try{
    if(state.user){
      sessionStorage.setItem("reportbox-session", JSON.stringify({user:state.user, view:state.view, stack:state.stack}));
    }else{
      sessionStorage.removeItem("reportbox-session");
    }
  }catch(e){ console.warn("Session storage unavailable", e); }
}
function restoreSession(){
  try{
    var raw = sessionStorage.getItem("reportbox-session");
    if(!raw) return;
    var saved = JSON.parse(raw);
    if(saved && saved.user && saved.user.name){
      state.user = saved.user;
      state.view = saved.view || "home";
      state.stack = Array.isArray(saved.stack) ? saved.stack : [];
    }
  }catch(e){ sessionStorage.removeItem("reportbox-session"); }
}
function clearSession(){ state.user = null; state.view = "login"; state.stack = []; try{ sessionStorage.removeItem("reportbox-session"); }catch(e){} }
function isOwner(){ return !!(state.user && state.user.isOwner); }
function canEdit(){ return !!(state.user && state.user.canEdit); }
 
/* ============ HELPERS ============ */
function showToast(msg, kind){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (kind ? " " + kind : "");
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.className = "toast"; }, 2400);
}
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function toCents(n){ return Math.round((parseFloat(n)||0) * 100); }
function money(cents){ var neg = cents < 0; var v = (Math.abs(cents)/100).toFixed(2); return (neg ? "-" : "") + "\u20b9" + v; }
function nowStamp(){ var d = new Date(); return d.toLocaleString(undefined, {day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit"}); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function navigate(view, push){
  if(push !== false) state.stack.push(state.view);
  state.view = view; saveSession(); render(); window.scrollTo({top:0, behavior:"smooth"});
}
function goBack(fallback){
  var prev = state.stack.pop();
  state.view = prev || fallback || "home"; saveSession(); render(); window.scrollTo({top:0, behavior:"smooth"});
}
 
/* ============ AUDIT LOG (feature: Audit Logs) ============ */
function logAction(action, detail){
  if(!Array.isArray(state.data.auditLog)) state.data.auditLog = [];
  state.data.auditLog.unshift({
    user: state.user ? state.user.name : "system",
    action: action,
    detail: detail || "",
    at: Date.now(),
    display: nowStamp()
  });
  if(state.data.auditLog.length > 300) state.data.auditLog.length = 300;
}
 
/* ============ AUTH ============ */
async function attemptLogin(name, pass){
  name = (name||"").trim();
  if(!name || !pass) return {ok:false, msg:"Enter both name and password."};
  await ensureOwnerPassword();
  var passHash = await hashPassword(pass);
  if(name.toUpperCase() === OWNER_NAME && passHash === state.data.ownerPasswordHash){
    return {ok:true, user:{name:OWNER_NAME, canEdit:true, isOwner:true}};
  }
  var rec = state.data.users[name];
  if(rec){
    if(rec.passwordHash && rec.passwordHash === passHash){
      return {ok:true, user:{name:name, canEdit:rec.access === "edit", isOwner:false}};
    }
    if(rec.password && rec.password === pass){
      rec.passwordHash = passHash; delete rec.password; if(!rec.access) rec.access = "view";
      await saveData();
      return {ok:true, user:{name:name, canEdit:rec.access === "edit", isOwner:false}};
    }
  }
  return {ok:false, msg:"Invalid name or password."};
}
async function attemptRegister(name, pass){
  name = (name||"").trim();
  if(!name || !pass) return {ok:false, msg:"Enter both name and password."};
  if(name.toUpperCase() === OWNER_NAME) return {ok:false, msg:"That name is reserved for the owner."};
  if(pass.length < 6) return {ok:false, msg:"Password should be at least 6 characters."};
  if(state.data.users[name]) return {ok:false, msg:"That name is already taken."};
  state.data.users[name] = {passwordHash:await hashPassword(pass), access:"view"};
  await saveData();
  logAction("Registered", name + " created a view-access account");
  await saveData();
  return {ok:true};
}
function recordLogin(name){
  state.data.loginHistory.unshift({name:name, at:Date.now(), display:nowStamp()});
  if(state.data.loginHistory.length > 200) state.data.loginHistory.length = 200;
  logAction("Signed in", name + " signed in");
  saveData();
}
async function changeOwnerPassword(currentPass, newPass, confirmPass){
  if(!currentPass || !newPass || !confirmPass) return {ok:false,msg:"Fill all password fields."};
  if(newPass.length < 8) return {ok:false,msg:"New password must be at least 8 characters."};
  if(newPass !== confirmPass) return {ok:false,msg:"New password and confirmation do not match."};
  await ensureOwnerPassword();
  if(await hashPassword(currentPass) !== state.data.ownerPasswordHash){ return {ok:false,msg:"Current password is incorrect."}; }
  state.data.ownerPasswordHash = await hashPassword(newPass);
  logAction("Owner password changed", "Owner updated their login password");
  await saveData();
  return {ok:true,msg:"Owner password changed successfully."};
}
 
/* ============ ROW HELPERS ============ */
function ensureTrailingEmpty(list, emptyCheckFn, makeEmptyFn){
  if(list.length === 0 || !emptyCheckFn(list[list.length-1])) list.push(makeEmptyFn());
}
function renumber(list){ list.forEach(function(r,i){ r.sno = i+1; }); }
 
/* ============ RENDER ROOT ============ */
function render(){
  var app = document.getElementById("app");
  if(state.loading){
    app.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;">Loading Report Box...</div>';
    return;
  }
  if(!state.user){ app.innerHTML = renderLogin(); bindLogin(); return; }
  var html = '<div class="topbar">' + renderTopbar() + '</div><div class="view">' + renderView() + '</div>';
  app.innerHTML = html;
  bindGlobal();
  bindView();
}

/* ============ LOGIN VIEW ============ */
function renderLogin(){
  return '' +
  '<div class="login-wrap">' +
    '<div class="gate-glow"></div>' +
    '<div class="login-card">' +
      '<div class="login-top"><button class="theme-toggle" title="Toggle theme">\ud83c\udf19</button></div>' +
      '<div class="login-logo">' +
        '<div class="bx-lg"><span>SV</span></div>' +
        '<h1>Report Box</h1>' +
        '<p>SV Sudeep Car Wash - vehicle logs &amp; business reporting</p>' +
      '</div>' +
      '<div class="tabs">' +
        '<button class="tab ' + (loginMode==="login"?"active":"") + '" data-mode="login">Sign in</button>' +
        '<button class="tab ' + (loginMode==="register"?"active":"") + '" data-mode="register">Register</button>' +
      '</div>' +
      '<div class="security-strip"><span>\ud83d\udd10</span><span><strong>Protected workspace</strong><br>Passwords are hashed (SHA-256) before storage. Access is role-based.</span></div>' +
      '<div class="err-msg" id="authErr"></div>' +
      '<div class="ok-msg" id="authOk"></div>' +
      '<div class="form-row"><label class="field-label">Name</label><input class="input" id="authName" placeholder="Your name" autocomplete="username"></div>' +
      '<div class="form-row"><label class="field-label">Password</label><div class="input-wrap"><input class="input" id="authPass" type="password" placeholder="Your password" autocomplete="current-password"><button type="button" class="password-toggle" data-toggle-password="authPass" aria-label="Show password">\ud83d\udc41</button></div></div>' +
      '<button class="btn primary" id="authSubmit" style="width:100%;">' + (loginMode==="login"?"Sign in":"Create account") + '</button>' +
      '<div class="hint">The owner controls worker permissions. Workers can be given View Access or Edit Access.</div>' +
    '</div>' +
  '</div>';
}
function bindPasswordToggles(){
  document.querySelectorAll("[data-toggle-password]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var id = btn.getAttribute("data-toggle-password");
      var input = document.getElementById(id);
      if(!input) return;
      var show = input.type === "password";
      input.type = show ? "text" : "password";
      btn.textContent = show ? "\ud83d\ude48" : "\ud83d\udc41";
    });
  });
}
function bindLogin(){
  document.querySelectorAll(".tab").forEach(function(t){ t.addEventListener("click", function(){ loginMode = t.getAttribute("data-mode"); render(); }); });
  document.querySelectorAll(".theme-toggle").forEach(function(b){ b.addEventListener("click", toggleTheme); });
  bindPasswordToggles();
  var err = document.getElementById("authErr");
  var ok = document.getElementById("authOk");
  document.getElementById("authSubmit").addEventListener("click", submit);
  document.getElementById("authPass").addEventListener("keydown", function(e){ if(e.key==="Enter") submit(); });
  async function submit(){
    var btn = document.getElementById("authSubmit");
    var name = document.getElementById("authName").value;
    var pass = document.getElementById("authPass").value;
    err.className = "err-msg"; ok.className = "ok-msg";
    btn.disabled = true; btn.textContent = "Checking\u2026";
    try{
      if(loginMode === "register"){
        var r = await attemptRegister(name, pass);
        if(!r.ok){ err.textContent = r.msg; err.className = "err-msg show"; return; }
        ok.textContent = "Account created - you can sign in now."; ok.className = "ok-msg show";
        loginMode = "login"; setTimeout(render, 900); return;
      }
      var res = await attemptLogin(name, pass);
      if(!res.ok){ err.textContent = res.msg; err.className = "err-msg show"; return; }
      playGateThenEnter(res.user);
    }finally{
      btn.disabled = false;
      if(document.getElementById("authSubmit")) document.getElementById("authSubmit").textContent = loginMode==="login"?"Sign in":"Create account";
    }
  }
}
function playGateThenEnter(user){
  var overlay = document.createElement("div");
  overlay.className = "gate-overlay";
  overlay.innerHTML = '<div class="gate-bar"></div><div class="gate-txt">ACCESS GRANTED - WELCOME ' + esc(user.name.toUpperCase()) + '</div>';
  document.body.appendChild(overlay);
  setTimeout(function(){
    state.user = user; recordLogin(user.name); state.view = "home"; state.stack = []; saveSession(); render();
    setTimeout(function(){ overlay.style.transition = "opacity .4s ease"; overlay.style.opacity = "0"; setTimeout(function(){overlay.remove();}, 420); }, 250);
  }, 950);
}

/* ============ VEHICLE DETAILS (with search + filter + Excel export) ============ */
function vEmpty(){ return {sno:0, date:"", type:"", name:"", enter:"", exit:"", amount:""}; }
function vIsEmpty(r){ return !r.type && !r.name && !r.enter && !r.exit && !r.amount; }
function ensureVehicleRows(){
  if(!Array.isArray(state.data.vehicles)) state.data.vehicles=[];
  state.data.vehicles.forEach(function(r){ if(!("date" in r)) r.date=""; });
  ensureTrailingEmpty(state.data.vehicles, vIsEmpty, vEmpty);
  renumber(state.data.vehicles);
}
function vehicleRowMatchesFilter(r){
  if(vehicleFilter.type && r.type !== vehicleFilter.type) return false;
  if(vehicleFilter.search){
    var q = vehicleFilter.search.toLowerCase();
    if((r.name||"").toLowerCase().indexOf(q) === -1) return false;
  }
  return true;
}
function renderVehicles(){
  ensureVehicleRows();
  var editable = canEdit();
  var rows = state.data.vehicles.map(function(r, idx){

      '<td><input class="cell-input" type="date" data-field="date" value="' + esc(r.date) + '" ' + (editable?'':'disabled') + '></td>' +
      '<td><select class="cell-input" data-field="type" ' + (editable?'':'disabled') + '>' + opts + '</select></td>' +
      '<td><input class="cell-input" data-field="name" placeholder="e.g. Honda Activa" value="' + esc(r.name) + '" ' + (editable?'':'disabled') + '></td>' +
      '<td><input class="cell-input" type="time" data-field="enter" value="' + esc(r.enter) + '" ' + (editable?'':'disabled') + '></td>' +
      '<td><input class="cell-input" type="time" data-field="exit" value="' + esc(r.exit) + '" ' + (editable?'':'disabled') + '></td>' +
      '<td><input class="cell-input" type="number" step="0.01" min="0" placeholder="0.00" data-field="amount" value="' + esc(r.amount) + '" ' + (editable?'':'disabled') + '></td>' +
      '<td>' + (editable ? rowActions(idx, isLast) : '') + '</td>' +
    '</tr>';
  }).join("");
 
  var typeOpts = '<option value="">All Types</option>' + VEHICLE_TYPES.map(function(t){ return '<option value="'+t+'" '+(vehicleFilter.type===t?'selected':'')+'>'+t+'</option>'; }).join('');
 
  return '' +
  '<div class="crumb">HOME / VEHICLE DETAILS</div>' +
  '<div class="section-head"><div><h2>Vehicle Details</h2><div class="sub">Capture vehicle type, vehicle name, timings and payment</div></div></div>' +
  (editable ? '<div class="security-strip"><span>\u270f\ufe0f</span><span><strong>Edit Access enabled.</strong> Add vehicle details directly in the table. Changes are synced to cloud storage.</span></div>' : '<div class="viewer-note">\ud83d\udc41 View-only access - you can see records but cannot change them.</div>') +

    logAction("Worker created", name + " (" + access + " access)");
    await saveData();
    ok.textContent="Worker created with "+(access==="edit"?"Edit":"View")+" Access."; ok.className="ok-msg show";

        showToast(name+" to "+(sel.value==="edit"?"Edit Access":"View Access"),"ok");

  });
  document.querySelectorAll("[data-action='delete-worker']").forEach(function(btn){

/* ============ SUMMARY RESULT (+ PDF export) ============ */
var lastSummary = null;
function computeSummary(from, to){
  var revC = 0, expC = 0, count = 0;
  state.data.reports.forEach(function(r){
    if(repIsEmpty(r) || !r.date) return;
    if(r.date >= from && r.date <= to){ revC += toCents(r.revenue); expC += toCents(r.expenses); count++; }
  });
  return {revC:revC, expC:expC, profitC: revC - expC, count:count};
}
function weekRange(){
  var d = new Date(); var day = (d.getDay() + 6) % 7;
  var mon = new Date(d); mon.setDate(d.getDate() - day);
  var sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  return [mon.toISOString().slice(0,10), sun.toISOString().slice(0,10)];
}
function monthRange(){
  var d = new Date();
  var first = new Date(d.getFullYear(), d.getMonth(), 1);
  var last = new Date(d.getFullYear(), d.getMonth()+1, 0);
  return [first.toISOString().slice(0,10), last.toISOString().slice(0,10)];
}

/* ============ GRAPH ============ */
function renderGraph(){
  var months = [];
  var now = new Date();
  for(var i=5;i>=0;i--){
    var d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({key:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"), label:d.toLocaleString(undefined,{month:"short"}), revC:0, expC:0});
  }
  state.data.reports.forEach(function(r){
    if(repIsEmpty(r) || !r.date) return;
    var key = r.date.slice(0,7);
    var m = months.find(function(mm){ return mm.key === key; });
    if(m){ m.revC += toCents(r.revenue); m.expC += toCents(r.expenses); }
  });
  var maxV = Math.max(1, ...months.map(function(m){ return Math.max(m.revC, m.expC, Math.abs(m.revC-m.expC)); }));
  var W = 640, H = 240, padL = 40, padB = 30, padT = 10;
  var groupW = (W - padL - 20) / months.length;
  var barW = groupW / 4;
  var scale = function(v){ return (v/maxV) * (H - padB - padT); };
  var bars = months.map(function(m, i){
    var x0 = padL + i*groupW + groupW*0.15;
    var revH = scale(m.revC), expH = scale(m.expC), profitVal = m.revC - m.expC, profH = scale(Math.abs(profitVal));
    var baseY = H - padB;
    var profColor = profitVal >= 0 ? "#3ED598" : "#FF5D6C";
    return '' +
      '<rect class="bar" x="'+x0+'" y="'+(baseY-revH)+'" width="'+barW+'" height="'+revH+'" fill="#F5A623" rx="2"/>' +
      '<rect class="bar" x="'+(x0+barW+4)+'" y="'+(baseY-expH)+'" width="'+barW+'" height="'+expH+'" fill="#5B6478" rx="2"/>' +
      '<rect class="bar" x="'+(x0+2*(barW+4))+'" y="'+(baseY-profH)+'" width="'+barW+'" height="'+profH+'" fill="'+profColor+'" rx="2"/>' +
      '<text class="axis-label" x="'+(x0+barW*1.5+4)+'" y="'+(H-10)+'" text-anchor="middle">'+m.label+'</text>';
  }).join("");
  var svg = '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">' +
    '<line x1="'+padL+'" y1="'+(H-padB)+'" x2="'+(W-10)+'" y2="'+(H-padB)+'" stroke="#2A3450" stroke-width="1"/>' + bars + '</svg>';
  return '' +
  '<div class="crumb">HOME / LOGS / DASHBOARD / GRAPHICAL WAY</div>' +
  '<div class="section-head"><div><h2>Graphical Overview</h2><div class="sub">Last 6 months | Revenue, expenses &amp; profit/loss</div></div></div>' +
  '<div class="chart-legend">' +
    '<div class="legend-item"><span class="legend-dot" style="background:#F5A623;"></span>Revenue</div>' +
    '<div class="legend-item"><span class="legend-dot" style="background:#5B6478;"></span>Expenses</div>' +
    '<div class="legend-item"><span class="legend-dot" style="background:#3ED598;"></span>Profit</div>' +
    '<div class="legend-item"><span class="legend-dot" style="background:#FF5D6C;"></span>Loss</div>' +
  '</div>' +
  '<div class="chart-svg-wrap">' + svg + '</div>' +
  '<div class="actions-row"><button class="btn ghost" data-nav="dashboard">Back</button><button class="btn ghost" data-nav-home="1">Home</button></div>';
}
 
/* ============ EXPORTS: PDF (jsPDF) + Excel (SheetJS) ============ */
function exportVehiclesExcel(){
  if(typeof XLSX === "undefined"){ showToast("Excel library failed to load - check your connection", "err"); return; }
  var rows = state.data.vehicles.filter(function(r){ return !vIsEmpty(r); }).map(function(r){
    return {"S.No":r.sno, "Date":r.date || "", "Type":r.type, "Name":r.name, "Enter":r.enter, "Exit":r.exit, "Amount":r.amount};
  });
  if(!rows.length){ showToast("No vehicle rows to export yet", "err"); return; }
  var ws = XLSX.utils.json_to_sheet(rows);
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Vehicles");
  XLSX.writeFile(wb, "reportbox-vehicles-" + todayISO() + ".xlsx");
  logAction("Exported", "Vehicles to Excel");
  saveData();
}
function exportReportsExcel(){
  if(typeof XLSX === "undefined"){ showToast("Excel library failed to load - check your connection", "err"); return; }
  var rows = state.data.reports.filter(function(r){ return !repIsEmpty(r); }).filter(reportRowMatchesFilter).map(function(r){
    return {"S.No":r.sno, "Date":r.date, "Expenses":r.expenses, "Revenue":r.revenue, "Profit":(profitOf(r)>=0 ? (profitOf(r)/100).toFixed(2) : "-"), "Loss":(profitOf(r)<0 ? (Math.abs(profitOf(r))/100).toFixed(2) : "-")};
  });
  if(!rows.length){ showToast("No report rows to export yet", "err"); return; }
  var ws = XLSX.utils.json_to_sheet(rows);
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Reports");
  XLSX.writeFile(wb, "reportbox-reports-" + todayISO() + ".xlsx");
  logAction("Exported", "Reports to Excel");
  saveData();
}
function exportReportsPDF(){
  if(typeof window.jspdf === "undefined"){ showToast("PDF library failed to load - check your connection", "err"); return; }
  var rows = state.data.reports.filter(function(r){ return !repIsEmpty(r); }).filter(reportRowMatchesFilter);
  if(!rows.length){ showToast("No report rows to export yet", "err"); return; }
  var doc = new window.jspdf.jsPDF();
  doc.setFontSize(14); doc.text("SV Sudeep Car Wash - Reports", 14, 16);
  doc.setFontSize(9); doc.setTextColor(120); doc.text("Generated " + nowStamp(), 14, 22);
  doc.autoTable({
    startY: 28,
    head: [["Date","Expenses","Revenue","Profit"]],
    body: rows.map(function(r){ return [r.date, r.expenses, r.revenue, money(profitOf(r))]; })
  });
  doc.save("reportbox-reports-" + todayISO() + ".pdf");
  logAction("Exported", "Reports to PDF");
  saveData();
}
function exportSummaryPDF(){
  if(!lastSummary){ showToast("Open a summary first", "err"); return; }
  if(typeof window.jspdf === "undefined"){ showToast("PDF library failed to load - check your connection", "err"); return; }
  var s = computeSummary(lastSummary.from, lastSummary.to);
  var doc = new window.jspdf.jsPDF();
  doc.setFontSize(14); doc.text("SV Sudeep Car Wash - " + lastSummary.label + " Summary", 14, 16);
  doc.setFontSize(9); doc.setTextColor(120); doc.text(lastSummary.from + " to " + lastSummary.to, 14, 22);
  doc.autoTable({
    startY: 28,
    head: [["Metric","Value"]],
    body: [["Entries", String(s.count)], ["Revenue", money(s.revC)], ["Expenses", money(s.expC)], ["Profit / Loss", money(s.profitC)]]
  });
  doc.save("reportbox-summary-" + lastSummary.from + "-to-" + lastSummary.to + ".pdf");
  logAction("Exported", lastSummary.label + " summary to PDF");
  saveData();
}
 
/* ============ BIND: GLOBAL ============ */
function bindGlobal(){
  var out = document.querySelector("[data-action='logout']");
  if(out) out.addEventListener("click", function(){ clearSession(); render(); });
  document.querySelectorAll(".theme-toggle").forEach(function(b){ b.addEventListener("click", toggleTheme); });
}
 
/* ============ BIND: PER VIEW ============ */
function bindView(){
  document.querySelectorAll("[data-nav]").forEach(function(b){ b.addEventListener("click", function(){ navigate(b.getAttribute("data-nav")); }); });
  document.querySelectorAll("[data-nav-home]").forEach(function(b){ b.addEventListener("click", function(){ state.stack = []; navigate("home", false); }); });
 
  if(state.view === "vehicles") bindVehicles();
  if(state.view === "reports") bindReports();
  if(state.view === "history") bindHistory();
  if(state.view === "summary-menu") bindSummaryMenu();
  if(state.view === "summary-result") bindSummaryResult();
  if(state.view === "settings") bindSettings();
}
 
function bindVehicles(){
  var body = document.getElementById("vehicleBody");
  if(!body) return;
  body.querySelectorAll("input[data-field], select[data-field]").forEach(function(inp){
    inp.addEventListener("change", function(){
      var idx = parseInt(inp.closest("tr").getAttribute("data-idx"), 10);
      var field = inp.getAttribute("data-field");
      state.data.vehicles[idx][field] = inp.value;
      saveData();
      showToast("Row updated", "ok");
    });
  });
  body.querySelectorAll("[data-action='save-vehicle-row']").forEach(function(btn){
    btn.addEventListener("click", function(){
      var idx = parseInt(btn.getAttribute("data-idx"), 10);
      var row = state.data.vehicles[idx];
      if(vIsEmpty(row)){ showToast("Add at least one detail before saving", "err"); return; }
      logAction("Vehicle added", (row.type||"Vehicle") + " " + (row.name||"") + " - " + money(toCents(row.amount)));
      if(idx === state.data.vehicles.length - 1){
        state.data.vehicles.push(vEmpty());
      }
      ensureVehicleRows();
      saveData();
      showToast("Row saved", "ok");
      render();
    });
  });
  body.querySelectorAll("[data-action='delete-vehicle-row']").forEach(function(btn){
    btn.addEventListener("click", function(){
      var idx = parseInt(btn.getAttribute("data-idx"), 10);
      var row = state.data.vehicles[idx];
      state.data.vehicles.splice(idx, 1);
      ensureVehicleRows();
      renumber(state.data.vehicles);
      if(row && (row.type || row.name || row.date || row.enter || row.exit || row.amount)){
        logAction("Vehicle deleted", (row.type||"Vehicle") + " " + (row.name||""));
      }
      saveData();
      showToast("Row deleted", "ok");
      render();
    });
  });
  var s = document.getElementById("vehicleSearch");
  if(s) s.addEventListener("input", function(){ vehicleFilter.search = s.value; applyVehicleFilterDom(); });
  var t = document.getElementById("vehicleTypeFilter");
  if(t) t.addEventListener("change", function(){ vehicleFilter.type = t.value; applyVehicleFilterDom(); });
  var clr = document.getElementById("vehicleFilterClear");
  if(clr) clr.addEventListener("click", function(){ vehicleFilter = {search:"", type:""}; render(); });
  var xls = document.getElementById("exportVehiclesExcel");
  if(xls) xls.addEventListener("click", exportVehiclesExcel);
  var addRow = document.getElementById("vehicleAddRowBtn");
  if(addRow) addRow.addEventListener("click", function(){
    ensureVehicleRows();
    var last = state.data.vehicles[state.data.vehicles.length - 1];
    if(last && vIsEmpty(last)){
      showToast("Empty row is already ready", "ok");
      return;
    }
    state.data.vehicles.push(vEmpty());
    renumber(state.data.vehicles);
    saveData();
    render();
  });
}
function applyVehicleFilterDom(){
  document.querySelectorAll("#vehicleBody tr").forEach(function(tr){
    var idx = parseInt(tr.getAttribute("data-idx"), 10);
    var isLast = idx === state.data.vehicles.length - 1;
    var r = state.data.vehicles[idx];
    var hide = !isLast && !vehicleRowMatchesFilter(r);
    tr.classList.toggle("filtered-out", hide);
  });
}
 
function bindReports(){
  var body = document.getElementById("reportBody");
  if(!body) return;
  body.querySelectorAll("input[data-field]").forEach(function(inp){
    inp.addEventListener("change", function(){
      var idx = parseInt(inp.closest("tr").getAttribute("data-idx"), 10);
      var field = inp.getAttribute("data-field");
      state.data.reports[idx][field] = inp.value;
      saveData();
    });
  });
  body.querySelectorAll("[data-action='edit-report-row']").forEach(function(btn){
    btn.addEventListener("click", function(){
      var idx = parseInt(btn.getAttribute("data-idx"), 10);
      reportEditingIdx = idx;
      render();
      showToast("Edit mode enabled", "ok");
    });
  });
  body.querySelectorAll("[data-action='save-report-row']").forEach(function(btn){
    btn.addEventListener("click", function(){
      var idx = parseInt(btn.getAttribute("data-idx"), 10);
      var row = state.data.reports[idx];
      if(repIsEmpty(row)){ showToast("Add date, expenses or revenue before saving", "err"); return; }
      logAction("Report saved", row.date + " - profit " + money(profitOf(row)));
      saveData();
      reportEditingIdx = null;
      showToast("Report entry saved", "ok");
      render();
    });
  });
  body.querySelectorAll("[data-action='delete-report-row']").forEach(function(btn){
    btn.addEventListener("click", function(){
      var idx = parseInt(btn.getAttribute("data-idx"), 10);
      var row = state.data.reports[idx];
      state.data.reports.splice(idx, 1);
      if(reportEditingIdx === idx) reportEditingIdx = null;
      else if(reportEditingIdx !== null && reportEditingIdx > idx) reportEditingIdx--;
      renumber(state.data.reports);
      logAction("Report deleted", row.date || "(untitled)");
      saveData();
      showToast("Entry deleted", "ok");
      render();
    });
  });
  var f = document.getElementById("reportFromFilter");
  if(f) f.addEventListener("change", function(){ reportFilter.from = f.value; render(); });
  var t = document.getElementById("reportToFilter");
  if(t) t.addEventListener("change", function(){ reportFilter.to = t.value; render(); });
  var clr = document.getElementById("reportFilterClear");
  if(clr) clr.addEventListener("click", function(){ reportFilter = {from:"", to:""}; render(); });
  var xls = document.getElementById("exportReportsExcel");
  if(xls) xls.addEventListener("click", exportReportsExcel);
  var pdf = document.getElementById("exportReportsPDF");
  if(pdf) pdf.addEventListener("click", exportReportsPDF);
}
 
function bindHistory(){
  if(!isOwner()) return;

  var clearBtn = document.getElementById("clearLoginHistory");
  if(clearBtn) clearBtn.addEventListener("click", async function(){
    if(!state.data.loginHistory.length){
      showToast("Login history is already empty", "err");
      return;
    }
    if(!confirm("Clear ALL login history? This cannot be undone.")) return;

    var count = state.data.loginHistory.length;
    state.data.loginHistory = [];
    logAction("Login history cleared", count + " login record(s) removed by owner");
    await saveData();
    showToast("Login history cleared", "ok");
    render();
  });

  var customBtn = document.getElementById("customDeleteHistory");
  if(customBtn) customBtn.addEventListener("click", async function(){
    var selected = Array.from(document.querySelectorAll("[data-history-index]:checked"))
      .map(function(cb){ return parseInt(cb.getAttribute("data-history-index"),10); })
      .filter(function(i){ return !isNaN(i); });

    if(!selected.length){
      showToast("Select one or more entries first", "err");
      return;
    }
    if(!confirm("Delete " + selected.length + " selected login entr" + (selected.length===1?"y":"ies") + "?")) return;

    var selectedSet = {};
    selected.forEach(function(i){ selectedSet[i] = true; });
    var oldCount = state.data.loginHistory.length;
    state.data.loginHistory = state.data.loginHistory.filter(function(_, i){ return !selectedSet[i]; });

    logAction("Custom login history delete", (oldCount - state.data.loginHistory.length) + " selected record(s) removed by owner");
    await saveData();
    showToast("Selected history deleted", "ok");
    render();
  });
}

function bindSummaryMenu(){
  document.querySelectorAll("[data-summary]").forEach(function(b){
    b.addEventListener("click", function(){
      var kind = b.getAttribute("data-summary");
      if(kind === "custom"){ document.getElementById("customRange").style.display = "block"; return; }
      var from, to, label;
      if(kind === "today"){ from = to = todayISO(); label = "Today's"; }
      if(kind === "week"){ var wr = weekRange(); from = wr[0]; to = wr[1]; label = "This Week's"; }
      if(kind === "month"){ var mr = monthRange(); from = mr[0]; to = mr[1]; label = "This Month's"; }
      lastSummary = {label:label, from:from, to:to};
      navigate("summary-result");
    });
  });
  var go = document.getElementById("rangeGo");
  if(go) go.addEventListener("click", function(){
    var f = document.getElementById("rangeFrom").value;
    var t = document.getElementById("rangeTo").value;
    if(!f || !t){ showToast("Pick both dates", "err"); return; }
    if(f > t){ showToast("From date must be before To date", "err"); return; }
    customFrom = f; customTo = t;
    lastSummary = {label:"Custom", from:f, to:t};
    navigate("summary-result");
  });
}
function bindSummaryResult(){
  var pdf = document.getElementById("exportSummaryPDF");
  if(pdf) pdf.addEventListener("click", exportSummaryPDF);
  var mail = document.getElementById("emailSummaryBtn");
  if(mail) mail.addEventListener("click", emailSummary);
}
async function emailSummary(){
  if(!emailReportsConfigured() || typeof emailjs === "undefined"){
    showToast("Configure EmailJS keys first (see README.md)", "err"); return;
  }
  if(!lastSummary) return;
  var s = computeSummary(lastSummary.from, lastSummary.to);
  try{
    emailjs.init(EMAILJS_PUBLIC_KEY);
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      to_email: EMAILJS_TO_ADDRESS,
      period: lastSummary.label + " (" + lastSummary.from + " to " + lastSummary.to + ")",
      revenue: money(s.revC), expenses: money(s.expC), profit: money(s.profitC), entries: s.count
    });
    logAction("Emailed", lastSummary.label + " summary sent to " + EMAILJS_TO_ADDRESS);
    saveData();
    showToast("Summary emailed", "ok");
  }catch(e){
    console.error(e);
    showToast("Email failed to send - check EmailJS setup", "err");
  }
}
 
function normalizeData(){
  if(!state.data || typeof state.data!=="object") state.data={};
  if(!Array.isArray(state.data.vehicles)) state.data.vehicles=[];
  if(!Array.isArray(state.data.reports)) state.data.reports=[];
  if(!state.data.users || typeof state.data.users!=="object") state.data.users={};
  if(!Array.isArray(state.data.loginHistory)) state.data.loginHistory=[];
  if(!Array.isArray(state.data.auditLog)) state.data.auditLog=[];
  if(!state.data.ownerPasswordHash) state.data.ownerPasswordHash="";
  Object.keys(state.data.users).forEach(function(name){
    var u=state.data.users[name];
    if(typeof u === "string") state.data.users[name]={password:u,access:"view"};
    if(!state.data.users[name].access) state.data.users[name].access="view";
  });
}
 
/* ============ INIT ============ */
async function init(){
  initTheme();
  await loadData();
  normalizeData();
  await ensureOwnerPassword();
  restoreSession();
  render();
}
init();
 
})();
